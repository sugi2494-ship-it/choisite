<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<title>실시간 강의 소통 · PBS COLOR LAB 최해숙</title>
<meta name="description" content="2027 최해숙의 컬러콘서트 · 《나는 왜 이 컬러에 끌릴까?》 출간기념회 실시간 소통방 — 채팅과 강의 자료를 휴대폰으로 바로." />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://www.pbscolor.com/live.html" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="PBS COLOR LAB" />
<meta property="og:title" content="2027 최해숙의 컬러콘서트 · 실시간 소통방" />
<meta property="og:description" content="《나는 왜 이 컬러에 끌릴까?》 출간기념회 · 2026.11.29 (일) 11:00 · 강남 교보문고" />
<meta property="og:image" content="https://www.pbscolor.com/assets/live-og.jpg?v=20261126" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="《나는 왜 이 컬러에 끌릴까?》 책 표지와 2027 최해숙의 컬러콘서트 안내" />
<meta property="og:url" content="https://www.pbscolor.com/live.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://www.pbscolor.com/assets/live-og.jpg?v=20261126" />
<link rel="icon" href="/assets/pbs-logo.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --ink:#111; --ink2:#3D3D3D; --ink3:#6E6E6E; --ink4:#9A9A9A;
  --line:#E7E7E7; --bg:#fff; --bg2:#FAFAFA; --bg3:#F3F3F3;
  --pbs:#E5007F; --pbs-deep:#C2006A; --pbs-hot:#FF2D9B; --tint:#FFEEF7;
  --ok:#0E9F6E;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg2); color:var(--ink); font-size:16px; line-height:1.6;
  word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; letter-spacing:-0.012em;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pbs);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 0 1px var(--line)}

/* 헤더 */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:12px 18px 10px}
.top-row img{height:24px;width:auto;object-fit:contain}
.brand{font-size:13px;font-weight:800;letter-spacing:.1em}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--pbs)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--pbs);animation:pulse 1.6s infinite}
.live.off{color:var(--ink4)} .live.off i{background:var(--ink4);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,0,127,.5)}70%{box-shadow:0 0 0 8px rgba(229,0,127,0)}100%{box-shadow:0 0 0 0 rgba(229,0,127,0)}}
.title{padding:0 18px 12px;font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.025em}
.me{padding:0 18px 12px;font-size:13px;color:var(--ink3)}
.me b{color:var(--ink);font-weight:700}
.me button{color:var(--pbs);font-weight:700;font-size:13px;margin-left:6px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);padding:0 10px}
.tab{padding:12px 0 11px;font-size:15px;font-weight:700;color:var(--ink3);border-bottom:2.5px solid transparent;position:relative}
.tab.on{color:var(--ink);border-bottom-color:var(--pbs)}
.tab .badge{position:absolute;top:8px;margin-left:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pbs);color:#fff;font-size:11px;font-weight:800;line-height:18px;display:none}
.tab .badge.show{display:inline-block}

/* 스포트라이트 */
.spot{display:none;margin:8px 12px;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,var(--pbs),var(--pbs-hot));color:#fff}
.spot.show{display:block}
.spot small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;opacity:.9;margin-bottom:4px}
.spot p{font-size:16px;font-weight:700;line-height:1.5}
.spot em{display:block;font-style:normal;font-size:12.5px;opacity:.85;margin-top:6px}

.draw{display:none;margin:8px 12px;padding:10px 12px;border-radius:14px;background:#16121B;color:#fff;text-align:center}
.draw.show{display:block;animation:pop .5s ease}
.draw small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#FFC94D}
.draw p{font-size:20px;font-weight:900;letter-spacing:.02em;margin-top:4px;line-height:1.3}
.win-pop{position:fixed;inset:0;z-index:80;background:rgba(22,18,27,.78);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wp-card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:26px 22px;text-align:center;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.6)}to{transform:scale(1)}}
.wp-ey{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--pbs)}
#wpImg:not([hidden]){display:block}
.wp-card h2{font-size:22px;font-weight:900;margin:6px 0 14px;line-height:1.3}
#wpNames{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#wpNames span{font-size:22px;font-weight:900;color:#fff;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,var(--pbs),#7B2FBE)}
#wpNames span.me{background:linear-gradient(135deg,#FFC94D,#FF2D9B);box-shadow:0 0 0 4px #FFE8A3}
.wp-me{margin-top:14px;font-size:17px;font-weight:800;color:var(--pbs)}
#wpClose,#gpClose{margin-top:18px;height:44px;padding:0 26px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800}
.eb{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.04em;color:#fff;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.eng-row{display:flex;align-items:center;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.eng-row span{font-size:12.5px;color:var(--ink3);font-weight:700;margin-right:2px}
.eng-row button{height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:800;border:2px solid var(--c);color:var(--c);background:#fff}
.eng-row button.on{background:var(--c);color:#fff}
.eng-row button[data-eng=RED]{--c:#FF3366}.eng-row button[data-eng=YELLOW]{--c:#E0951A}.eng-row button[data-eng=GREEN]{--c:#00A878}.eng-row button[data-eng=BLUE]{--c:#0077B6}
.rename{display:flex;gap:6px;padding:0 18px 10px}
.rename input{flex:1;min-width:0;height:40px;border:1.5px solid var(--pbs);border-radius:10px;padding:0 12px;font-size:16px;outline:none}
.rename button{height:40px;padding:0 14px;border-radius:10px;background:var(--pbs);color:#fff;font-weight:800;font-size:14px}
.rename button.ghost{background:var(--bg3);color:var(--ink2)}
.att-link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--pbs),#7B2FBE);color:#fff;text-decoration:none;font-weight:800;font-size:15.5px;max-width:300px;box-shadow:0 6px 18px rgba(229,0,127,.25)}
.att-link::after{content:'→';font-size:20px}
.bub a{color:inherit;text-decoration:underline;word-break:break-all}
#gpNames{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-height:46vh;overflow:auto}
#gpNames span{font-size:16px;font-weight:800;color:#fff;padding:7px 13px;border-radius:999px}
#gpNames span.me{box-shadow:0 0 0 3px #16121B}
/* 본문 */
.pane{display:none;flex:1;padding:14px 18px 130px}
.pane.on{display:block}
.sortbar{display:flex;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink3);background:#fff}
.chip.on{border-color:var(--ink);color:#fff;background:var(--ink)}
.empty{padding:44px 10px;text-align:center;color:var(--ink4);font-size:14.5px}
.empty b{display:block;font-size:30px;margin-bottom:6px}

.q{display:flex;gap:12px;padding:14px 14px 14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;transition:border-color .2s}
.q.mine{border-color:#F7B3D6;background:#FFF9FC}
.q.done{opacity:.62}
.q.new{animation:pop .5s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.q-body{flex:1;min-width:0}
.q-meta{font-size:12.5px;color:var(--ink3);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.q-meta b{color:var(--ink2);font-weight:700}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px}
.tag.ans{background:#E7F7EF;color:var(--ok)}
.tag.spot-t{background:var(--tint);color:var(--pbs)}
.q-text{font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.like{flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:48px;padding:7px 6px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--ink3);background:#fff}
.like svg{width:18px;height:18px}
.like.on{border-color:var(--pbs);color:var(--pbs);background:var(--tint)}

.msg{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:10px}
.msg .who{font-size:12px;color:var(--ink3);margin:0 4px 3px;font-weight:600}
.msg .bub{max-width:82%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bg3);font-size:15px;line-height:1.5;white-space:pre-wrap}
.msg.mine{align-items:flex-end}
.msg.mine .bub{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px}
.msg.host .bub{background:var(--tint);border:1px solid #F7B3D6;color:var(--ink)}
.msg.host .who{color:var(--pbs);font-weight:800}
.msg time{font-size:11px;color:var(--ink4);margin:2px 6px 0}

.mat{color:inherit;text-decoration:none;display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px}
.mat .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--pbs);display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.02em}
.mat .t{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4}
.mat .t small{display:block;font-size:12px;color:var(--ink4);font-weight:500;margin-top:2px}
.mat .go{flex:none;font-size:13px;font-weight:800;color:#fff;background:var(--pbs);padding:9px 14px;border-radius:10px}

.att-img{display:block;margin-top:2px}
.att-img img{display:block;max-width:min(240px,70vw);max-height:280px;border-radius:12px;border:1px solid var(--line);background:#fff}
.att-file{display:inline-flex;align-items:center;gap:8px;margin-top:2px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;max-width:240px}
.att-file span{flex:none;font-size:10.5px;font-weight:900;color:var(--pbs);background:var(--tint);padding:3px 6px;border-radius:6px}
.clip{flex:none;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:20px;line-height:1}
.clip:disabled{opacity:.5}
/* 입력창 */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
.composer-in{pointer-events:auto;max-width:640px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;line-height:1.45;max-height:120px;background:var(--bg2);outline:none}
.composer textarea:focus{border-color:var(--pbs);background:#fff}
.send{flex:none;height:46px;padding:0 18px;border-radius:14px;background:var(--pbs);color:#fff;font-weight:800;font-size:15px}
.send:disabled{background:#F2A6CC}
.composer .hint{position:absolute;left:0;right:0;bottom:100%;text-align:center;pointer-events:none}
.composer.hide{display:none}
.counter{font-size:11px;color:var(--ink4);text-align:right;padding:0 16px 2px;max-width:640px;margin:0 auto;background:#fff}

/* 입장 화면 */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 26px 60px}
.gate .logo{height:44px;width:auto;align-self:flex-start;object-fit:contain;margin-bottom:26px}
.gate .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:var(--pbs);margin-bottom:8px}
.gate h1{font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.gate .sub{color:var(--ink3);font-size:15px;margin-bottom:28px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:17px;outline:none;background:#fff}
.field input:focus{border-color:var(--pbs)}
.field input.code{text-transform:uppercase;letter-spacing:.18em;font-weight:800;text-align:center;font-size:22px}
.ck-pop{position:fixed;left:16px;right:16px;top:18%;z-index:90;display:flex;justify-content:center;animation:popIn .45s cubic-bezier(.2,1.6,.4,1);transition:opacity .5s}
.ck-pop div{background:#fff;border:2px solid var(--pbs);border-radius:18px;padding:18px 20px;font-size:17px;font-weight:800;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.25);max-width:380px}
.ck-pop.out{opacity:0}
.ck-lead{font-size:15px;font-weight:800;color:var(--pbs);margin:2px 0 12px}
.ck-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck-row .field span em,#ckBox .field span em{font-style:normal;font-weight:500;color:var(--ink3)}
#ckTel{text-align:center;letter-spacing:.12em;font-weight:800;font-size:20px}
.btn{width:100%;height:56px;border-radius:14px;background:var(--pbs);color:#fff;font-size:17px;font-weight:800;margin-top:6px}
.btn:active{background:var(--pbs-deep)}
.err{min-height:22px;color:#D72C2C;font-size:13.5px;font-weight:600;margin-top:10px;text-align:center}
.note{margin-top:22px;font-size:12.5px;color:var(--ink4);text-align:center;line-height:1.6}
.closed{padding:16px;margin:14px 18px 0;border-radius:14px;background:var(--bg3);color:var(--ink2);font-size:14px;font-weight:600;text-align:center;display:none}
.closed.show{display:block}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{padding:18px;text-align:center;font-size:11.5px;color:var(--ink4);letter-spacing:.06em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">

  <!-- 입장 -->
  <section class="gate" id="gate">
    <img class="logo" src="/assets/pbs-logo.png" alt="PBS COLOR LAB" />
    <p class="eyebrow">LIVE CLASS</p>
    <h1 id="gateTitle">강의 실시간 소통방</h1>
    <p class="sub">실시간 채팅 · 강의 자료</p>
    <label class="field" id="codeField">
      <span>입장 코드</span>
      <input class="code" id="codeIn" maxlength="10" inputmode="numeric" autocomplete="off" autocapitalize="characters" placeholder="20271004" />
    </label>
    <label class="field" id="nickField">
      <span>닉네임</span>
      <input id="nickIn" maxlength="20" autocomplete="nickname" placeholder="화면에 보일 이름" />
    </label>
    <div id="ckBox" hidden>
      <p class="ck-lead">✅ 참석 확인을 하고 바로 입장해요</p>
      <label class="field"><span>이름 <em>(참석 확인용)</em></span><input id="ckName" maxlength="20" autocomplete="name" placeholder="예) 최해숙" /></label>
      <div class="ck-row">
        <label class="field"><span>전화번호 뒤 4자리</span><input id="ckTel" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="1234" /></label>
        <label class="field"><span>채팅방 닉네임 <em>(추첨 이름)</em></span><input id="ckNick" maxlength="14" autocomplete="nickname" placeholder="비우면 이름으로" /></label>
      </div>
    </div>
    <button class="btn" id="enterBtn">입장하기</button>
    <p class="err" id="gateErr"></p>
    <p class="note" id="gateNote">이름 대신 닉네임 사용 가능 · 연락처 입력 없음</p>
  </section>

  <!-- 강의방 -->
  <div id="room" hidden style="display:flex;flex-direction:column;flex:1">
    <header class="top">
      <div class="top-row">
        <img src="/assets/pbs-logo.png" alt="" />
        <span class="brand">LIVE CLASS</span>
        <span class="live" id="liveDot"><i></i>LIVE</span>
      </div>
      <h1 class="title" id="roomTitle"></h1>
      <p class="me" id="roomSub" style="margin-top:-8px;color:var(--pbs-deep);font-weight:600"></p>
      <p class="me" id="meRow"><span class="eb" id="meEng" hidden></span><b id="meNick"></b> 님으로 참여 중<button id="renameBtn">이름 바꾸기</button></p>
      <div class="rename" id="renameBox" hidden><input id="renameIn" maxlength="20" placeholder="새 닉네임"><button id="renameOk">저장</button><button id="renameNo" class="ghost">취소</button></div>
      <div class="eng-row"><span>내 컬러 엔진</span>
        <button data-eng="RED">빨강</button><button data-eng="YELLOW">노랑</button><button data-eng="GREEN">초록</button><button data-eng="BLUE">파랑</button>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab on" data-tab="c" role="tab" id="chatTab">채팅<span class="badge" id="bc"></span></button>
        <button class="tab" data-tab="m" role="tab">자료실<span class="badge" id="bm"></span></button>
      </nav>
      <div class="draw" id="draw"><small>🎁 행운권 당첨</small><p id="drawText"></p></div>
      <div class="spot" id="spot"><small>지금 소개하는 글</small><p id="spotText"></p><em id="spotWho"></em></div>
    </header>


    <div class="closed" id="closedNote">종료된 강의 · 채팅과 자료는 계속 볼 수 있음</div>

    <section class="pane on" id="pane-c"><div id="cList"></div></section>
    <section class="pane" id="pane-m"><div id="mList"></div></section>
    <p class="foot">PBS COLOR LAB · 최해숙</p>
  </div>
</div>

<div class="composer hide" id="composer">
  <div class="composer-in">
    <button class="clip" id="clipBtn" aria-label="사진·파일 보내기">📎</button>
    <input type="file" id="clipFile" hidden />
    <textarea id="msgIn" rows="1" maxlength="300" placeholder="메시지 보내기"></textarea>
    <button class="send" id="sendBtn" disabled>보내기</button>
  </div>

  function renderMats(){
    $('#mList').innerHTML = mats.length ? mats.map(a => `
      <a class="mat" href="${esc(a.url)}" target="_blank" rel="noopener">
        <span class="ic">${fileKind(a.url)}</span>
        <span class="t">${esc(a.title)}<small>${new Date(a.created_at).toLocaleDateString('ko-KR')} 공유</small></span>
        <span class="go">열기</span>
      </a>`).join('')
      : '<div class="empty"><b>📁</b>강의 자료 준비 중<br>공유되면 여기에 바로 표시</div>';
  }

  function counts(){ const v = [...msgs.values()]; return { c: v.filter(m=>m.kind==='chat').length, m: mats.length }; }
  function badges(){
    const n = counts();
    if (!seen.init) { Object.assign(seen, n, {init:true}); }
    seen[tab] = n[tab];
    for (const k of ['c','m']) { const d = n[k] - seen[k]; const b = $('#b'+k); b.textContent = d > 99 ? '99+' : d; b.classList.toggle('show', d > 0 && k !== tab); }
  }

  function setTab(t){
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t));
    badges(); updateComposer();
    if (t === 'c') setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); else window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  
  function updateComposer(){
    const show = room && room.is_open && tab === 'c' && room.chat_on;
    $('#composer').classList.toggle('hide', !show);
    $('#msgIn').placeholder = '메시지 보내기';
  }

  const ta = $('#msgIn');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; $('#sendBtn').disabled = !ta.value.trim(); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
  $('#sendBtn').onclick = send;
  $('#clipFile').accept = ATT_ACCEPT;
  $('#clipBtn').onclick = () => $('#clipFile').click();
  $('#clipFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f || !room) return;
    $('#clipBtn').disabled = true; toast('올리는 중');
    try {
      const a = await uploadChatFile(room.id, f);
      const cap = ta.value.trim();
      const { data, error } = await sb.rpc('live_post3', { p_code: room.code, p_client: clientId, p_nick: nick, p_engine: engine, p_body: cap, p_attach_url: a.url, p_attach_name: a.name, p_attach_kind: a.kind });
      if (error) throw error;
      mine.add(data); store.set('pbs_live_mine', [...mine].slice(-300));
      ta.value = ''; ta.style.height = 'auto'; $('#sendBtn').disabled = true;
      toast(a.kind === 'image' ? '사진 보내기 완료' : '파일 보내기 완료');
      await loadAll(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
    } catch(err) {
      const m = String(err && err.message || '');
      toast(m === 'size' ? '15MB 이하 파일만 가능' : /mime|type/i.test(m) ? '보낼 수 없는 파일 형식' : /잠시/.test(m) ? '조금 천천히 보내기' : '보내기 실패 · 다시 시도');
    } finally { $('#clipBtn').disabled = false; }
  };

  let sending = false;
  async function send(){
    const body = ta.value.trim(); if (!body || sending) return;
    sending = true; $('#sendBtn').disabled = true;
    const kind = 'chat';
    const { data, error } = await sb.rpc('live_post3', { p_code: room.code, p_client: clientId, p_nick: nick, p_engine: engine, p_body: body });
    sending = false;
    if (error) { toast(/잠시/.test(error.message) ? '조금 천천히 보내기' : /종료/.test(error.message) ? '종료된 강의' : '전송 실패 · 다시 시도'); $('#sendBtn').disabled = false; return; }
    mine.add(data); store.set('pbs_live_mine', [...mine].slice(-300));
    ta.value = ''; ta.style.height = 'auto';
    if (kind === 'question') toast('질문 등록 완료');
    if (!msgs.has(data)) await loadAll();
    renderAll();
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-like]'); if (!b) return;
    const id = +b.dataset.like; const on = !liked.has(id);
    on ? liked.add(id) : liked.delete(id); store.set('pbs_live_liked', [...liked]);
    const m = msgs.get(id); if (m) { m.likes = Math.max(0, m.likes + (on?1:-1)); renderQ(); }
    await sb.rpc('live_like', { p_id: id, p_delta: on ? 1 : -1 });
  });

  if (urlCode && nick) enter();
})();
</script>
</body>
</html>
