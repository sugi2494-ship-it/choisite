  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9px 13px;border-bottom:1px solid #efe9e3;color:#3a342f\"><span data-ef=\"\">총 4차시 · 각 2시간 (총 8시간)<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#faf7f4;padding:9px 13px;font-weight:700;color:#16130f;border-bottom:1px solid #efe9e3;border-right:1px solid #efe9e3\">강의일시<\u002Fdiv>\n          <div style=\"padding:9px 13px;border-bottom:1px solid #efe9e3;border-right:1px solid #efe9e3;color:#3a342f\"><span data-ef=\"\">20OO. OO. OO. ~<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#faf7f4;padding:9px 13px;font-weight:700;color:#16130f;border-bottom:1px solid #efe9e3;border-right:1px solid #efe9e3\">강의장소<\u002Fdiv>\n          <div style=\"padding:9px 13px;border-bottom:1px solid #efe9e3;color:#3a342f\"><span data-ef=\"\">OOO 교육장<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#faf7f4;padding:9px 13px;font-weight:700;color:#16130f;border-right:1px solid #efe9e3\">강의대상<\u002Fdiv>\n          <div style=\"padding:9px 13px;border-right:1px solid #efe9e3;color:#3a342f\"><span data-ef=\"\">퇴직예정자 · 시니어<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#faf7f4;padding:9px 13px;font-weight:700;color:#16130f;border-right:1px solid #efe9e3\">교육인원<\u002Fdiv>\n          <div style=\"padding:9px 13px;color:#3a342f\"><span data-ef=\"\">OO명<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:15px\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n          <span style=\"width:5px;height:15px;background:#e6007e;border-radius:2px\"><\u002Fspan>\n          <h2 style=\"font-size:14px;font-weight:800;letter-spacing:-.3px;color:#16130f\">강의 목표<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;line-height:1.5;color:#3a342f\">퇴직 이후의 삶을 주체적으로 설계하고, 변화에 유연하게 적응하며 여가·건강·디지털 역량을 갖춰 활기찬 인생 2막을 준비한다.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:16px;flex:1\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n          <span style=\"width:5px;height:15px;background:#e6007e;border-radius:2px\"><\u002Fspan>\n          <h2 style=\"font-size:14px;font-weight:800;letter-spacing:-.3px;color:#16130f\">차시별 운영 계획<\u002Fh2>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px\">\n          <div style=\"border:1px solid #ede7e1;border-radius:8px;padding:13px 14px\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\">\n              <span style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#e6007e;line-height:1\">1<\u002Fspan>\n              <div><span style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:#a89e97\">차시 · 2H<\u002Fspan><h3 style=\"font-size:13px;font-weight:800;color:#16130f;letter-spacing:-.2px\">변화관리<\u002Fh3><\u002Fdiv>\n            <\u002Fdiv>\n            <ul style=\"list-style:none;display:grid;gap:4px;font-size:11.5px;line-height:1.4;color:#4a443f\">\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>퇴직이라는 변화의 수용과 심리 이해<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>생애주기와 인생 2막 설계의 의미<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>변화 속에서 찾는 새로운 역할과 목표 설정<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>긍정적 마인드셋과 스트레스 관리<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #ede7e1;border-radius:8px;padding:13px 14px\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\">\n              <span style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#e6007e;line-height:1\">2<\u002Fspan>\n              <div><span style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:#a89e97\">차시 · 2H<\u002Fspan><h3 style=\"font-size:13px;font-weight:800;color:#16130f;letter-spacing:-.2px\">여가 · 사회공헌<\u002Fh3><\u002Fdiv>\n            <\u002Fdiv>\n            <ul style=\"list-style:none;display:grid;gap:4px;font-size:11.5px;line-height:1.4;color:#4a443f\">\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>나에게 맞는 여가 유형 탐색<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>의미 있는 여가 · 취미 활동 설계<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>자원봉사 · 재능기부 등 사회공헌 참여 방법<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>지역사회 연계 활동 및 참여 사례 소개<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #ede7e1;border-radius:8px;padding:13px 14px\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\">\n              <span style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#e6007e;line-height:1\">3<\u002Fspan>\n              <div><span style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:#a89e97\">차시 · 2H<\u002Fspan><h3 style=\"font-size:13px;font-weight:800;color:#16130f;letter-spacing:-.2px\">시니어 이미지 · 건강관리<\u002Fh3><\u002Fdiv>\n            <\u002Fdiv>\n            <ul style=\"list-style:none;display:grid;gap:4px;font-size:11.5px;line-height:1.4;color:#4a443f\">\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>시니어 이미지 메이킹(컬러·스타일·표정)<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>첫인상과 호감 가는 커뮤니케이션<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>건강한 노년을 위한 생활습관과 운동<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>영양 · 수면 · 정서 건강 관리<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #ede7e1;border-radius:8px;padding:13px 14px\">\n            <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\">\n              <span style=\"font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#e6007e;line-height:1\">4<\u002Fspan>\n              <div><span style=\"font-size:11px;font-weight:700;letter-spacing:1px;color:#a89e97\">차시 · 2H<\u002Fspan><h3 style=\"font-size:13px;font-weight:800;color:#16130f;letter-spacing:-.2px\">시니어 AI 교육<\u002Fh3><\u002Fdiv>\n            <\u002Fdiv>\n            <ul style=\"list-style:none;display:grid;gap:4px;font-size:11.5px;line-height:1.4;color:#4a443f\">\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>디지털 · AI 기초 개념 이해<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>스마트폰 · 생성형 AI 활용 실습(챗봇·사진/문서)<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>일상 속 AI 서비스 활용(키오스크·길찾기·금융)<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:7px\"><span style=\"color:#d99cc4\">–<\u002Fspan><span>디지털 안전 · 정보보호와 사기 예방<\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:12px;background:#faf7f4;border:1px solid #efe9e3;border-radius:8px;padding:12px 16px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:1px;color:#b06a92;margin-bottom:6px\">비고<\u002Fdiv>\n          <ul style=\"list-style:none;display:grid;gap:3px;font-size:11px;line-height:1.4;color:#5a534d\">\n            <li style=\"display:flex;gap:8px\"><span style=\"color:#d99cc4\">·<\u002Fspan><span>각 차시 2시간 구성 · 기관 일정에 따라 차시 선택 및 순서 조정 가능<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:8px\"><span style=\"color:#d99cc4\">·<\u002Fspan><span>실습 진행 시 교구·재료비 별도 협의 (인원·구성에 따라 상이)<\u002Fspan><\u002Fli>\n            <li style=\"display:flex;gap:8px\"><span style=\"color:#d99cc4\">·<\u002Fspan><span>개인 · 그룹 및 단체 교육 진행 가능<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:auto;padding-top:13px;border-top:1.5px solid #16130f;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8a8079\">\n        <span>본 기획안은 운영 협의에 따라 일부 조정될 수 있습니다.<\u002Fspan>\n        <span style=\"font-weight:700;color:#16130f\">교육문의 · 최해숙 &nbsp;|&nbsp; 010-4285-7997 &nbsp;|&nbsp; pbscolor77@naver.com<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { doPrint: () => window.print() };\n  }\n\n  componentDidMount() {\n    const LS = 'pbs-plan-ef-v2';\n    const LECTURE_IDS = ['doc-pc', 'doc-ct', 'doc-gg', 'doc-ms'];\n    const LECTURES = [\n      { id: 'doc-pc', label: '퍼스널컬러' },\n      { id: 'doc-ct', label: '컬러테라피' },\n      { id: 'doc-gg', label: '골격분석' },\n      { id: 'doc-ms', label: '미래설계교육' },\n    ];\n    const FIELDS = [\n      { input: 'f-주제', labels: ['강의주제'] },\n      { input: 'f-대상', labels: ['강의대상'] },\n      { input: 'f-인원', labels: ['교육인원'] },\n      { input: 'f-일시', labels: ['강의일시'] },\n      { input: 'f-장소', labels: ['강의장소'] },\n      { input: 'f-시간', labels: ['강의시간', '차시'] },\n      { input: 'f-강사', labels: ['강사명'] },\n    ];\n\n    // ---- mark 교시 / 목표 / 비고 text as editable (data-edit) ----\n    LECTURE_IDS.forEach(id => {\n      const sec = document.getElementById(id);\n      if (!sec) return;\n      // 교시/항목 제목\n      sec.querySelectorAll('h3').forEach(h => h.setAttribute('data-edit', ''));\n      // 목표 문단 + 비고 안내문단\n      sec.querySelectorAll('p').forEach(p => p.setAttribute('data-edit', ''));\n      // 불릿 항목의 텍스트(마지막 span)\n      sec.querySelectorAll('ul li').forEach(li => {\n        const spans = li.querySelectorAll(':scope > span');\n        if (spans.length >= 2) spans[spans.length - 1].setAttribute('data-edit', '');\n      });\n    });\n\n    // ---- persistence: every editable element by stable document order ----\n    const editEls = () => [...document.querySelectorAll('[data-ef],[data-edit]')];\n    const save = () => {\n      try { localStorage.setItem(LS, JSON.stringify(editEls().map(s => s.textContent))); } catch (e) {}\n    };\n    const restore = () => {\n      let data; try { data = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}\n      if (!Array.isArray(data)) return;\n      const spans = editEls();\n      if (data.length !== spans.length) return; // structure changed — skip stale restore\n      data.forEach((t, i) => { if (spans[i] != null && typeof t === 'string') spans[i].textContent = t; });\n    };\n\n    // make every editable field directly clickable + persistent\n    editEls().forEach(s => {\n      s.setAttribute('contenteditable', 'true');\n      s.setAttribute('spellcheck', 'false');\n      s.addEventListener('input', () => { save(); syncInputs(); });\n    });\n    restore();\n\n    // ---- field lookup ----\n    const valueSpan = (secId, labels) => {\n      const sec = document.getElementById(secId);\n      if (!sec) return null;\n      const divs = [...sec.querySelectorAll('div')];\n      for (const lab of labels) {\n        const labelDiv = divs.find(d => d.childElementCount === 0 && d.textContent.trim() === lab && d.nextElementSibling && d.nextElementSibling.querySelector('[data-ef]'));\n        if (labelDiv) {\n          return labelDiv.nextElementSibling.querySelector('[data-ef]');\n        }\n      }\n      return null;\n    };\n\n    const sel = document.getElementById('f-target');\n    LECTURES.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.label; sel.appendChild(o); });\n\n    const target = () => sel.value;\n\n    const syncInputs = () => {\n      FIELDS.forEach(f => {\n        const inp = document.getElementById(f.input);\n        const span = valueSpan(target(), f.labels);\n        if (!inp) return;\n        if (span) { inp.disabled = false; inp.style.opacity = '1'; inp.value = span.textContent.trim(); }\n        else { inp.value = ''; inp.disabled = true; inp.style.opacity = '.4'; }\n      });\n    };\n\n    FIELDS.forEach(f => {\n      const inp = document.getElementById(f.input);\n      if (!inp) return;\n      inp.addEventListener('input', () => {\n        const span = valueSpan(target(), f.labels);\n        if (span) { span.textContent = inp.value; save(); }\n      });\n    });\n\n    sel.addEventListener('change', () => {\n      syncInputs();\n      const el = document.getElementById(target());\n      if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 130; window.scrollTo({ top: y, behavior: 'smooth' }); }\n    });\n\n    // ---- print single lecture ----\n    const printTarget = (ids) => {\n      const desk = document.querySelector('.desk');\n      const secs = [...document.querySelectorAll('.sheet')];\n      const on = secs.filter(s => ids.includes(s.id));\n      secs.forEach(s => s.classList.remove('print-on'));\n      on.forEach((s, i) => { s.classList.add('print-on'); s.style.pageBreakAfter = i === on.length - 1 ? 'auto' : 'always'; s.style.breakAfter = i === on.length - 1 ? 'auto' : 'page'; });\n      desk.setAttribute('data-only', '1');\n      const done = () => { desk.removeAttribute('data-only'); on.forEach(s => { s.classList.remove('print-on'); s.style.pageBreakAfter = ''; s.style.breakAfter = ''; }); window.removeEventListener('afterprint', done); };\n      window.addEventListener('afterprint', done);\n      window.print();\n    };\n\n    document.getElementById('btn-one').addEventListener('click', () => printTarget([target()]));\n\n    // ---- focus mode: nav click shows only that document group ----\n    const desk = document.querySelector('.desk');\n    let currentGroup = ['all'];\n    const navLinks = [...document.querySelectorAll('nav a[data-group]')];\n\n    const applyFocus = (ids) => {\n      currentGroup = ids;\n      const all = ids.length === 1 && ids[0] === 'all';\n      const secs = [...document.querySelectorAll('.sheet')];\n      secs.forEach(s => s.classList.toggle('focus-on', ids.includes(s.id)));\n      if (all) desk.removeAttribute('data-focus');\n      else desk.setAttribute('data-focus', '1');\n      navLinks.forEach(a => a.classList.toggle('nav-active', a.getAttribute('data-group') === ids.join(',')));\n      // sync the auto-fill select if a single lecture is focused\n      if (ids.length === 1 && LECTURE_IDS.includes(ids[0])) { sel.value = ids[0]; syncInputs(); }\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    };\n\n    navLinks.forEach(a => {\n      a.addEventListener('click', (e) => {\n        e.preventDefault();\n        const g = a.getAttribute('data-group');\n        applyFocus(g === 'all' ? ['all'] : g.split(','));\n      });\n    });\n\n    // nav button: PDF of whatever is currently in focus (or all)\n    const viewBtn = document.getElementById('btn-view-pdf');\n    if (viewBtn) viewBtn.addEventListener('click', () => {\n      if (currentGroup.length === 1 && currentGroup[0] === 'all') { window.print(); return; }\n      printTarget(currentGroup);\n    });\n\n    document.getElementById('btn-reset').addEventListener('click', () => {\n      if (!confirm('선택한 기획안의 입력값을 기본 안내문구로 되돌릴까요?')) return;\n      const defaults = {\n        '강의일시': '20OO. OO. OO.(OO) OO:OO ~ OO:OO', '강의장소': 'OOO 강의실', '교육인원': 'OO명',\n      };\n      FIELDS.forEach(f => {\n        const span = valueSpan(target(), f.labels);\n        if (span && defaults[f.labels[0]]) span.textContent = defaults[f.labels[0]];\n      });\n      save(); syncInputs();\n    });\n\n    syncInputs();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
