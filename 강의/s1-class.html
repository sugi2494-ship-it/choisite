<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 웹페이지 만들기 · 수업 강의실 · ConnectOn Bridge</title>
<style>
:root{--navy:#012042;--navy2:#0A2550;--teal:#0A7377;--teald:#075C5F;--mint:#6FD6D9;--sky:#2E9BD6;--cream:#F7F2E7;--ink:#1C2430;--gray:#5A6472;--line:#E3E6EC;--bg:#F4F7F9;color-scheme:light;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 60px;}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);}
.top .in{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.mark{width:40px;height:40px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 40px;}
.mark b{color:#fff;font-size:20px;font-weight:900;}.mark i{width:9px;height:9px;background:var(--sky);border-radius:2px;display:inline-block;margin-left:1px;}
.top .tt b{font-size:15px;font-weight:900;color:var(--navy);display:block;}
.top .tt small{font-size:12px;color:var(--gray);}
/* hero */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:26px 24px;margin:20px 0 14px;}
.hero .sct{display:inline-block;background:var(--mint);color:var(--navy);font-weight:900;font-size:12.5px;padding:4px 12px;border-radius:100px;margin-bottom:10px;}
.hero h1{font-size:26px;font-weight:900;letter-spacing:-.02em;}
.hero p{font-size:14.5px;color:#CFE0E0;margin-top:8px;}
.hero .out{margin-top:13px;background:rgba(255,255,255,.08);border:1px solid rgba(111,214,217,.35);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#EAF6F6;}
.hero .out b{color:var(--mint);font-weight:900;}
.hero .how{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
.hero .how span{background:rgba(255,255,255,.1);border:1px solid rgba(111,214,217,.4);border-radius:100px;padding:6px 13px;font-size:12.5px;color:#fff;font-weight:700;}
/* section */
.sec{margin-top:26px;}
.sec .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sec .sh .n{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;}
.sec.s1 .n{background:var(--navy);}.sec.s2 .n{background:var(--teal);}
.sec .sh b{font-size:18px;font-weight:900;color:var(--navy);}
.sec .sh small{font-size:12.5px;color:var(--gray);}
/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.12s;text-align:left;}
.card:hover{border-color:var(--mint);box-shadow:0 6px 20px rgba(1,32,66,.08);transform:translateY(-1px);}
.card .no{flex:0 0 40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;}
.s1 .card .no{background:linear-gradient(135deg,var(--navy),var(--navy2));}.s2 .card .no{background:linear-gradient(135deg,var(--teal),var(--teald));}
.card .ct b{display:block;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:3px;}
.card .ct small{font-size:12.5px;color:var(--gray);line-height:1.4;}
.card .arw{margin-left:auto;color:var(--mint);font-size:20px;font-weight:900;align-self:center;}
/* activity view */
#act{display:none;}
.abar{display:flex;align-items:center;gap:12px;margin:18px 0 6px;flex-wrap:wrap;}
.back{background:#fff;border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-size:13.5px;font-weight:800;color:var(--navy);cursor:pointer;}
.back:hover{border-color:var(--mint);}
.prog{font-size:12.5px;color:var(--gray);font-weight:700;}
.ahead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:6px;}
.ahead .tag{font-size:12.5px;font-weight:800;color:var(--teal);}
.ahead h2{font-size:24px;font-weight:900;color:var(--navy);margin-top:4px;letter-spacing:-.02em;}
.block{margin-top:16px;}
.goal{background:#EAF0F6;border-left:5px solid var(--navy);border-radius:10px;padding:13px 16px;font-size:15px;color:var(--navy);}
.goal b{font-weight:900;}
.lh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:var(--navy);margin:18px 0 9px;}
.lh .ic{width:26px;height:26px;border-radius:8px;background:var(--mint);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900;font-size:14px;}
ol.steps{list-style:none;counter-reset:st;}
ol.steps li{position:relative;padding:9px 0 9px 46px;font-size:15px;border-bottom:1px solid #EEF1F5;}
ol.steps li:last-child{border-bottom:none;}
ol.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:8px;width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.prompt{background:var(--navy);border-radius:12px;padding:14px 16px;margin:10px 0;position:relative;}
.prompt .pl{font-size:12.5px;font-weight:800;color:var(--mint);margin-bottom:8px;padding-right:80px;}
.prompt pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13.5px;color:#E8EEF2;line-height:1.5;}
.cp{position:absolute;top:12px;right:12px;background:var(--mint);color:var(--navy);border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer;}
.cp:active{transform:scale(.96);}
ul.chk{list-style:none;}
ul.chk li{position:relative;padding:7px 0 7px 30px;font-size:14.5px;}
ul.chk li::before{content:'';position:absolute;left:0;top:10px;width:16px;height:16px;border:2px solid var(--teal);border-radius:4px;}
.tip{background:var(--cream);border-radius:10px;padding:12px 15px;font-size:14px;color:var(--ink);margin-top:14px;}
.tip b{color:var(--teald);}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}
.nav2 button{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;font-weight:800;color:var(--navy);cursor:pointer;}
.nav2 button:hover:not(:disabled){border-color:var(--mint);}
.nav2 button:disabled{opacity:.35;cursor:default;}
.nav2 .next{background:var(--navy);color:#fff;border-color:var(--navy);}
.foot{text-align:center;color:var(--gray);font-size:12.5px;margin-top:34px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 22px;border-radius:100px;font-size:13.5px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:50;}
.toast.on{opacity:1;}
</style></head><body>

<script>
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const D=[
/*S1*/
{s:1,n:1,t:'내 업종 고르기 · 브랜딩 분석',sub:'클로드와 대화로 내 브랜드 찾기',goal:'클로드가 질문을 하나씩 던져 ①내 소개 ②브랜드 한 문장 ③웹페이지 방향 ④콘텐츠 초안을 뽑아 줍니다. 이게 뒤 활동의 재료입니다.',
steps:['클로드에서 새 대화를 엽니다. (작업은 처음부터 끝까지 한 대화에서)','아래 프롬프트를 복사해 붙여넣습니다.','질문에 한 줄씩 답합니다. (막히면 "예시 줘")','나온 <내 소개>를 클로드 설정 → 나에 대한 정보에 저장합니다.'],
p:[['나 발견하기 (클로드와 1:1 대화)',`너는 나를 1:1로 돕는 다정한 브랜딩 코치야. 나는 AI가 처음인 초보야.
[진행] 질문은 한 번에 하나씩, 10개 이내, 쉬운 말로. 막히면 예시 2~3개 줘서 고르게.
[알아낼 것] 무슨 일/누구를 돕는지 · 지역·대상 · 잘하는 것 · 고민 · 나만의 점 · 느낌(색) · 웹페이지로 이루고 싶은 것
[끝나면] ① <내 소개> ② <브랜드 한 문장>="나는 [누구]에게 [무엇]을 [어떻게] 주는 사람"+키워드5 ③ <웹페이지 방향> 3가지 ④ 내용 초안
준비됐으면 첫 질문 하나만 해줘.`]],
chk:['<내 소개>를 클로드 설정에 저장했다','<브랜드 한 문장>이 나왔다','웹페이지 방향 3가지를 정했다']},

{s:1,n:2,t:'레퍼런스 · 포지셔닝',sub:'나만의 차별점을 한 줄로',goal:'잘 된 같은 업종 페이지를 보고 "나는 그들과 무엇이 다른가(포지셔닝)"를 한 줄로 정합니다.',
steps:['네이버·구글에 내 업종+지역을 검색해 잘 된 2~3곳을 봅니다.','각 페이지가 "왜 믿음이 가지?"를 한 줄씩 메모합니다.','아래 프롬프트로 포지셔닝 한 줄 3개를 받아 하나 고릅니다.'],
p:[['포지셔닝 한 줄',`같은 분야에 이런 사람들이 있어: [레퍼런스 좋은 점 한 줄씩].
내가 그들과 '무엇이 다른지'가 드러나는 포지셔닝 한 줄 3개를 제안해줘.
"나는 [누구]에게 [무엇]을 [어떻게] 주는 사람" 형태로, 과장 없이. 왜 와닿는지 한 줄씩.`]],
chk:['레퍼런스 좋은 점을 적었다','포지셔닝 한 줄을 골랐다']},

{s:1,n:3,t:'핵심 메시지 · 키워드',sub:'첫 화면 문구 + 검색 키워드',goal:'포지셔닝을 "첫 화면 핵심 메시지"로 다듬고, 손님이 검색할 키워드를 뽑습니다.',
steps:['활동 2의 포지셔닝 한 줄을 꺼냅니다.','아래 프롬프트로 메시지 3개 + 키워드 10개를 받습니다.','손님이 진짜 검색할 키워드 5개에 동그라미 칩니다.'],
p:[['핵심 메시지 · 키워드',`내 포지셔닝: [한 줄] / 대상·지역·업종.
1) 첫 화면에 크게 넣을 핵심 메시지 3개(10~20자)
2) 손님이 검색창에 칠 키워드 10개
3) 꼭 넣을 키워드 5개 + 왜 중요한지 한 줄씩.`]],
chk:['핵심 메시지 한 문장을 골랐다','핵심 키워드 5개를 정했다']},

{s:1,n:4,t:'구조 · 메뉴 설계',sub:'방문자 질문 순서로 메뉴 배치',goal:'좋은 구조는 방문자 머릿속 질문 순서예요 — ①뭐 하는 곳 ②나한테 필요 ③믿을 만한가 ④어떻게 신청. 목표에 맞는 메뉴와 순서를 정합니다.',
steps:['이 페이지의 핵심 목표를 최대 2개 고릅니다.','목표에 맞는 메뉴를 고르고 필요 없는 건 뺍니다.','메뉴 순서를 "무엇 → 신뢰 → 일정·비용 → 신청"으로 정리합니다.'],
p:[['① 상단 고정 메뉴바',`지금 만든 웹페이지 맨 위에 항상 보이는 상단 메뉴(내비게이션 바)를 추가해줘.
- 메뉴 항목: 홈 · 소개 · 강의 · 후기 · 문의
- 누르면 그 섹션으로 부드럽게 스크롤, 모바일에서는 햄버거(≡) 메뉴로 접히게.`],
['② 섹션 순서·제목 정리',`섹션 순서를 이렇게 바꿔줘: ①첫 화면(이름·한줄소개·프로필) ②나의 강의 ③소개(내 이야기) ④후기·경력 ⑤문의.
각 섹션 맨 위에 큰 제목을 넣어, 스크롤할 때 지금 어느 부분인지 바로 알 수 있게.`],
['③ FAQ(자주 묻는 질문) 추가',`'자주 묻는 질문' 섹션을 추가해줘. 질문 4개(예: 수업 대상, 준비물, 소요 시간, 비용 문의 방법)와 답변을 넣고, 질문을 누르면 답이 펼쳐지는 아코디언 형태로.`],
['④ 눈에 띄는 신청·문의 버튼',`페이지 곳곳에 '강의 문의하기' 버튼을 눈에 띄게 넣어줘. 누르면 맨 아래 문의 섹션으로 가거나 전화(tel:)·카카오톡으로 바로 연결. 색은 브랜드 포인트 색, 모바일에서도 누르기 좋은 크기로.`],
['⑤ 깔끔한 푸터(맨 아래)',`맨 아래에 푸터를 만들어줘. 이름/브랜드명, 연락처(전화·이메일), 인스타·블로그 링크, 저작권 한 줄(© 2026 이름). 배경은 차분한 색, 글자는 작고 단정하게.`]],
chk:['핵심 목표를 정했다','메뉴와 순서를 정리했다','FAQ·버튼·푸터를 넣었다']},

{s:1,n:5,t:'페이지 제작',sub:'주문서로 첫 페이지 만들고 다듬기',goal:'활동 1~4 결과를 "주문서"로 보내 첫 페이지를 만들고, 말로 하나씩 다듬습니다. 순서: 뼈대 → 글 → 사진 → 색. 처음부터 완벽하지 않아도 괜찮아요. 아래 프롬프트 중 "내 상황"에 맞는 걸 골라 복사해 쓰세요.',
steps:['① 첫 페이지 띄우기 — 제작 프롬프트 붙여넣기','② 뼈대·글 다듬기 — 구조 진단부터','③ 사진 넣기 — 끌어다 놓고 "~에 넣어줘"','④ 색·디자인 — 색 조합부터 (색은 AI가 대신 골라줌)','막히면 아래 "막혔을 때" 프롬프트를 쓰세요.'],
p:[['① 첫 페이지 제작 (활동 1~4 결과를 채워서)',`너는 전문 웹디자이너야. 아래 정보로 모바일에 잘 보이는 '한 페이지 웹사이트'를 만들어 화면에 바로 보여줘. 못 적은 칸은 지금까지 대화를 근거로 네가 채워줘.
【목표】[활동4 목표] 【브랜드】브랜드명·[활동2 한 문장]·[활동3 메시지]·대상·강점 【메뉴】[활동4 순서] 【톤】분위기·강조색
고정 메뉴바 / 첫 화면=브랜드명+메시지+버튼2(문의·자세히)+프로필 자리 / 섹션은 메뉴 순서대로 / 문의 폼 / 강조색 2~3개·넉넉한 여백 / 반응형 / 사진은 '자리(회색박스)'만. HTML 한 파일로.`],
['② 뼈대 — 내 페이지 구조 진단받기 (가장 중요)',`지금 만든 이 페이지의 구조를 점검해줘. 나는 전문가가 아니라 뭘 넣고 빼야 할지 판단이 안 돼.
1. 지금 어떤 섹션이 어떤 순서로 있는지 목록으로.
2. 이 페이지 목표는 [예: 강의 문의받기]야. 방문자가 ①뭐 하는 곳 ②나에게 필요한지 ③믿어도 되는지 ④어떻게 신청 순서로 이해되는지 봐줘.
3. 문제점 3가지(빠진 내용/순서 어긋남/산만한 것).
4. 바꿀 순서를 제안해줘. 각 섹션마다 "왜 여기 있어야 하는지" 한 줄로. 아직 고치지 말고 제안만.`],
['② 제안대로 바꾸기',`좋아, 네가 제안한 구조로 바꿔줘. 단, 지금 들어 있는 내 내용(글·정보)은 그대로 살리고 새로 지어내지 마. 각 섹션에 알아보기 쉬운 제목을 달고, 문의·신청 버튼은 첫 화면과 맨 아래에 각각. 바꾼 뒤 달라진 점 3줄로.`],
['② 방문자 입장에서 점검',`네가 [예: 수강 고민 중인 40대 여성]이라고 생각하고 이 페이지를 처음 본다고 상상해줘. 위에서 아래로 읽으며 드는 생각을 순서대로, 어디서 "이게 뭐지?" 막히는지, 끝까지 보고 [문의하기]를 누르고 싶은지 솔직하게 말해줘.`],
['② 글 — 내 말투로 바꾸기',`글이 좀 딱딱해. 전체를 [따뜻하고 다정한] 말투로 바꿔줘. 전문성은 유지하되 사람이 직접 쓴 것처럼 자연스럽게. 과장·광고 문구는 빼고.`],
['② 글 — 첫 화면 문구 고치기',`첫 화면 문구가 마음에 안 들어. [내 대상]이 보자마자 "내 얘기다" 느낄 문구로 3개만 제안해줘. 고르면 그걸로 바꿔줘.`],
['② 글 — 가짜 경력·숫자 지우기',`내가 알려주지 않은 내용이 들어가 있어. [예: 15년 경력] 이 부분은 사실이 아니야. 지워줘. 앞으로 내가 준 정보만 사용해줘.`],
['③ 사진 — 프로필 넣기',`(사진을 첨부한 뒤 함께 보내세요)
이 사진을 첫 화면 프로필 자리에 넣어줘. 동그란 모양으로, 얼굴이 가운데 오게 해줘.`],
['③ 사진 — 로고 넣기',`(로고 파일을 첨부한 뒤 함께 보내세요)
이 로고를 페이지 맨 위 왼쪽에 넣어줘. 너무 크지 않게, 글자가 잘 보이는 크기로.`],
['③ 사진 — 크기·위치 고치기',`프로필 사진이 너무 커. 지금의 절반 크기로 줄이고, 사진 아래에 내 이름이 오게 해줘.`],
['③ 사진 — 아직 없을 때',`사진은 나중에 넣을게. 지금은 사진이 들어갈 자리만 예쁘게 표시하고 "사진 준비 중"이라고 써줘.`],
['④ 색 — 내 브랜드에 맞는 조합 제안받기',`이 페이지 색을 내 브랜드에 맞게 정리하고 싶어. 나는 색 전문가가 아니니 네가 제안해줘.
- 강점 색: [예: RED] / 분위기: [예: 단정·신뢰] / 대상: [예: 40~50대 여성] / 목표: [예: 문의받기]
색 조합 3가지(각각 메인·보조·배경 + 인상 + 왜 어울리는지 한 줄). 한 조합당 2~3색만. 아직 적용 말고 제안만.`],
['④ 색 — 고른 조합 적용',`[2번] 조합으로 전체에 적용해줘. 색은 그 안에서만, 강조색은 버튼·중요 문구에만, 섹션마다 배경색을 번갈아 써서 구분되게.`],
['④ 디자인 — 여백·레이아웃 정리',`레이아웃을 정리해줘. 섹션 사이 여백을 넉넉·일정하게, 글이 너무 긴 곳은 읽기 좋은 폭으로, 제목·본문 크기 차이를 분명하게, 사진과 글을 균형 있게, 휴대폰·PC 둘 다 자연스럽게. 바꾼 걸 3줄로.`],
['④ 디자인 — 전문가가 만든 것처럼',`이 페이지를 전문가가 만든 것처럼 한 단계 올려줘. 단, 색·구조·내 글은 그대로 두고 완성도만. 첫 화면이 인상적으로, 과한 효과는 금지, 버튼이 눌러도 되는 것처럼 분명하게.`],
['④ 버튼 — 문의·신청 강조',`[문의하기] 버튼을 더 눈에 띄게, 첫 화면과 맨 아래에 각각. 누르면 [내 카톡/전화]로 연결되게.`],
['막혔을 때 — 되돌리기',`방금 바꾼 건 취소하고, 바로 이전 상태로 되돌려줘.`],
['막혔을 때 — 엉뚱한 곳까지 바뀜',`[강의 소개] 부분만 고쳐줘. 다른 부분은 지금 그대로 두고 건드리지 마.`],
['막혔을 때 — 느려지면 (미리 백업)',`지금까지 만든 웹페이지 전체 코드를 그대로 보여줘. 내가 복사해서 보관할게. (메모장에 저장 → 새 대화에 붙여넣어 이어가기)`],
['막혔을 때 — 휴대폰에서 이상',`휴대폰 화면에서 글자가 잘리고 답답해 보여. 휴대폰에서 잘 보이도록 전체를 정리하고 버튼도 누르기 편한 크기로.`]],
chk:['화면에 내 페이지가 떴다','구조 진단 → 제안대로 정리했다','글을 내 말투로 다듬었다','사진·로고를 넣었다(또는 자리 잡음)','색·여백을 정리하고 문의 버튼이 연결된다','전체 코드를 복사해 백업했다']},

{s:1,n:6,t:'완성도 고도화 + 검수',sub:'공개 전 AI로 전체 점검',goal:'톤·연락처·후기를 정리하고, 공개 전 AI로 전체를 점검합니다. 오타·안 되는 버튼까지 잡아 줍니다.',
steps:['연락처·SNS·후기가 실제로 연결되는지 봅니다.','아래 전체 검수 프롬프트를 돌립니다.','나온 수정 사항을 그 자리에서 고칩니다.','느려지기 전에 전체 코드를 복사해 백업합니다.'],
p:[['① 전체 검토 (한 번에 점검)',`내가 만든 이 웹페이지를 처음부터 끝까지 검토해줘.
- 깨지거나 이상하게 보이는 부분 / 작동하지 않는 버튼·링크 / 모바일에서 어색한 곳 / 오타·어색한 문장
찾아서 목록으로 알려주고, 그 자리에서 고쳐줘.`],
['② 링크·버튼 연결 확인',`페이지의 모든 버튼과 링크가 제대로 연결됐는지 하나씩 확인해줘. 특히 전화(tel:)·카카오톡·인스타/블로그·문의 버튼이 실제로 눌러지는지 점검하고, 안 되는 게 있으면 올바르게 고쳐줘.`],
['③ 가독성·접근성 점검',`글자 크기와 색 대비가 읽기 편한지, 어르신이나 눈이 불편한 분도 보기 쉬운지 점검해줘. 너무 흐린 글자색, 너무 작은 글씨, 배경과 안 어울리는 색을 찾아 고쳐줘.`],
['④ 맞춤법·띄어쓰기 교정',`페이지에 있는 모든 문구의 맞춤법과 띄어쓰기를 점검해서 자연스럽게 고쳐줘. 어색한 번역 투나 딱딱한 표현도 부드럽게 다듬어줘.`],
['⑤ 공개 전 최종 체크리스트',`이 웹페이지를 공개하기 전에 확인해야 할 최종 체크리스트를 만들어줘. 제목·연락처·대표 이미지·모바일 화면·로딩 속도·문의 방법 등 항목별로 "OK/수정필요"를 표시할 수 있게.`]],
chk:['전체 검토로 오류를 고쳤다','링크·버튼이 실제로 눌러진다','가독성·맞춤법을 다듬었다','공개 전 체크리스트가 전부 OK']},

{s:1,n:7,t:'배포 · 내 주소 만들기',sub:'index.html → 넷리파이 → 내 주소',goal:'페이지를 index.html 한 파일로 받아 넷리파이에 올려 누구나 들어오는 "공개 URL"을 만듭니다. 무료, 10분. 오늘의 하이라이트!',
steps:['아래 프롬프트로 index.html 한 파일을 내려받습니다. (파일명 꼭 index.html)','app.netlify.com/drop 에 그 파일을 끌어다 놓습니다.','주소가 생기면 구글 계정으로 가입해 주소를 유지합니다.','휴대폰에서 열어 확인하고, 주소 이름을 바꿉니다.'],
p:[['① 파일 하나(index.html)로 만들기',`지금까지 만든 웹페이지를 index.html 이라는 이름의 파일 하나로 만들어서 내려받게 해줘.
- 사진·로고가 파일 안에 같이 들어가 다른 컴퓨터에서 열어도 보이게. 파일은 딱 하나만.`],
['② 올렸는데 사진이 안 보일 때',`넷리파이에 올렸더니 사진·로고가 안 보여. 파일은 index.html 하나뿐이야.
사진이 파일 바깥 경로를 가리키고 있으면, 사진을 파일 안에 포함(base64로 내장)해서 어디서 열어도 보이게 index.html을 다시 만들어줘.`],
['③ 올린 뒤 휴대폰에서 확인·정리',`방금 만든 공개 주소를 휴대폰에서 열어봤더니 [글자가 잘림 / 버튼이 작음 / 사진이 넘침]. 휴대폰에서 자연스럽게 보이도록 정리하고 index.html을 다시 만들어줘.`]],
chk:['공개 URL이 생겼다','휴대폰에서 잘 보인다','사진이 보인다','index.html을 보관했다']},

{s:1,n:8,t:'홍보 · 확산',sub:'프로필에 심기 + 미리보기 + QR',goal:'이미 사람들이 보는 곳(카톡·인스타 프로필·명함)에 주소를 심고, 카톡 미리보기·QR·명함까지 만듭니다.',
steps:['내가 쓰는 곳에 주소를 넣습니다. (인스타 프로필 = 효과 1위)','OG 프롬프트로 카톡 미리보기를 예쁘게 만들고 다시 배포합니다.','QR 코드·명함 문구를 만듭니다.','혼자 이어가는 4주 루틴 1주차 날짜를 정합니다.'],
p:[['① 카톡 미리보기(OG) 만들기',`내 페이지를 카톡·SNS로 공유할 때 제목·설명·사진이 예쁘게 뜨게 해줘.
제목:[   ] 설명:[   ] 미리보기 사진=첫 화면 프로필.
검색엔진용 제목·설명(메타 태그)도 같이 넣어서 index.html을 다시 만들어줘.`],
['② QR 코드 만들기',`내 주소 [https://내주소]로 들어오는 QR코드를 크고 선명하게 만들어줘.
QR 아래에 [내 이름/브랜드]를 넣고, 이미지 파일로 내려받게 해줘. (명함·전단·현수막에 넣을 거야)`],
['③ 명함·프로필 소개 문구',`내 브랜드를 알리는 짧은 소개 문구를 만들어줘.
- 명함 뒷면용 한 줄 소개 - 인스타 프로필 소개(줄바꿈 포함) - 카톡 상태메시지용 한 줄
각각 내 주소를 자연스럽게 넣고, 과장 없이 따뜻하게.`],
['④ 혼자 이어가는 4주 점검 루틴',`웹페이지를 공개한 뒤 혼자 4주 동안 관리할 간단한 루틴을 만들어줘.
매주 무엇을 확인하고(방문·문의·후기), 무엇을 하나씩 추가·수정하면 좋을지, 주차별 할 일 1~2개씩 체크리스트로.`]],
chk:['주소를 심고 열리는지 확인했다','카톡 미리보기가 뜬다','QR을 만들었다','명함 문구·4주 루틴을 받았다']},

/*S2*/
{s:2,n:1,t:'검색 키워드 전략',sub:'손님이 칠 말을 찾아 키워드맵',goal:'검색은 "손님이 치는 말"에 내 페이지가 들어 있어야 잡힙니다. 노려볼 키워드 3개와 해시태그로 키워드맵을 만듭니다.',
steps:['네이버에 내 분야를 쳐서 자동완성에 뜨는 말을 봅니다.','아래 프롬프트로 키워드 10개 + 노려볼 3개를 받습니다.','해시태그까지 정리해 키워드맵 한 장으로 만듭니다.'],
p:[['키워드 뽑기',`내 강의/브랜드의 검색 키워드를 뽑아줘.
- 나:[포지셔닝 한 문장] - 대상자:[대상] - 지역:[있으면]
1) 대상자가 검색창에 칠 단어·문장 10개 2) 현실적으로 노려볼 3개(경쟁 낮고 딱 맞는 것)
3) 제목·소개글·본문에 자연스럽게 넣은 예시 문장.`]],
chk:['키워드 10개를 뽑았다','노려볼 3개를 정했다']},

{s:2,n:2,t:'네이버 노출',sub:'서치어드바이저 등록 · 사이트맵',goal:'국내 검색은 네이버가 큽니다. 서치어드바이저에 사이트를 등록하고 사이트맵을 제출합니다. 한 번만 하면 됩니다.',
steps:['사이트맵 주소(내주소/sitemap.xml)를 확인합니다. 없으면 AI에 "sitemap.xml 만들어줘".','searchadvisor.naver.com → 사이트 등록.','소유확인(메타태그 한 줄)을 내 페이지 <head>에 넣습니다.','요청 → 사이트맵 제출 + 수집 요청. (지역이면 스마트플레이스도 등록)'],
p:[['네이버 서치어드바이저 등록',`너는 나를 1:1로 돕는 도우미야. 나는 왕초보야.
네이버 서치어드바이저에 내 사이트를 등록하고 소유확인·사이트맵 제출·수집요청까지 한 단계씩 안내해줘.
- 내 사이트 주소:[붙여넣기] - 사이트맵 주소:[내주소/sitemap.xml]
한 번에 한 단계, 쉬운 말, 누를 위치까지.`]],
chk:['서치어드바이저 등록·소유확인','사이트맵 제출','(지역) 플레이스 등록']},

{s:2,n:3,t:'콘텐츠 · 후기 · 마케팅',sub:'주제·달력·첫 글 · 후기',goal:'도움 되는 글을 꾸준히(주 2회) 올리고, 후기를 모아 노출합니다. 후기 한 줄이 다음 기수를 만듭니다.',
steps:['아래 프롬프트로 주제 30개 → 4주 달력 → 첫 글 초안을 받습니다.','블로그·인스타에 첫 글을 올립니다.','후기 폼을 만들어 수료생에게 요청하고, 좋은 걸 노출합니다.'],
p:[['주제 30개 → 4주 달력 → 글 초안',`내 블로그·SNS 콘텐츠 주제 30개를 뽑아줘(대상자/분야:[1섹션 결과]). 대상자가 검색·궁금해할 것 위주.

const META={
 1:{cls:'s1', title:'AI 웹페이지 만들기', brand:'AI 웹페이지 만들기 · 1섹션',
    heroH:'AI 웹페이지 만들기', secsub:'기획 → 제작 → 배포 → 홍보',
    heroP:'활동 1번부터 8번까지 순서대로 눌러 들어가, 프롬프트를 복사해 Claude에 붙여넣으며 따라 하세요.',
    out:'이 8단계를 마치면 — <b>인터넷에 공개된 내 웹페이지 주소</b>가 생깁니다. (휴대폰·카톡에서 열리는 진짜 사이트)'},
 2:{cls:'s2', title:'브랜드 마케팅 · 고도화', brand:'브랜드 마케팅 · 고도화 · 2섹션',
    heroH:'브랜드 마케팅 · 고도화', secsub:'키워드 → 네이버·구글 노출 → SEO/GEO → 접수 → 도메인',
    heroP:'1섹션에서 만든 내 웹페이지를, 검색에 뜨고 신청을 받는 "장사되는 페이지"로 키웁니다. 활동 1~8을 순서대로.',
    out:'이 8단계를 마치면 — <b>네이버·구글 검색에 뜨고, 신청을 받고, 내이름.com 주소</b>를 가진 페이지가 됩니다.'}
};
const M=META[SEC];
const LIST=D.filter(d=>d.s===SEC);
document.title=`${M.title} · ${SEC}섹션 · 수업 강의실`;
document.getElementById('brandt').textContent=`AI 웹페이지 전문가 마스터과정 · ${SEC}섹션`;
document.getElementById('sct').textContent=`SECTION ${SEC}`;
document.getElementById('heroH').textContent=M.heroH;
document.getElementById('heroP').textContent=M.heroP;
document.getElementById('heroOut').innerHTML=M.out;
document.getElementById('secwrap').className='sec '+M.cls;
document.getElementById('secn').textContent=SEC;
document.getElementById('sect').textContent=M.title;
document.getElementById('secsub').textContent=M.secsub;
document.getElementById('g').innerHTML=LIST.map((d,k)=>
 `<button class="card" onclick="openAct(${k})"><div class="no">${d.n}</div><div class="ct"><b>${d.t}</b><small>${d.sub}</small></div><div class="arw">›</div></button>`).join('');
function openAct(k){const d=LIST[k];
 let h=`<div class="abar"><button class="back" onclick="home()">← 활동 목록</button><span class="prog">SECTION ${SEC} · 활동 ${d.n} / ${LIST.length}</span></div>`;
 h+=`<div class="ahead ${M.cls}"><div class="tag">SECTION ${SEC} · 활동 ${d.n}</div><h2>${d.t}</h2>`;
 h+=`<div class="block"><div class="goal">🎯 <b>목표</b> — ${d.goal}</div></div>`;
 h+=`<div class="block"><div class="lh"><span class="ic">▶</span>화면에서 따라하기</div><ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
 h+=`<div class="block"><div class="lh"><span class="ic">▌</span>복붙 프롬프트 <span style="font-weight:700;color:var(--gray);font-size:12.5px">— 내 상황에 맞는 것만 골라 쓰세요</span></div>`;
 d.p.forEach(([lb,tx])=>{h+=`<div class="prompt"><button class="cp" onclick="cpy(this)">📋 복사</button><div class="pl">${lb}</div><pre>${esc(tx)}</pre></div>`;});
 h+=`</div>`;
 h+=`<div class="block"><div class="lh"><span class="ic">✓</span>체크리스트 — 다 되면 다음 활동으로</div><ul class="chk">${d.chk.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
 const prev=k>0?k-1:null, next=k<LIST.length-1?k+1:null;
 h+=`<div class="nav2"><button ${prev===null?'disabled':''} onclick="openAct(${prev})">← 이전 활동</button><button class="next" ${next===null?'disabled':''} onclick="openAct(${next})">${next===null?'🎉 마지막 활동':'다음 활동 →'}</button></div>`;
 h+=`<div class="foot">커넥트온브릿지 · AI 웹페이지 전문가 마스터과정 · ${SEC}섹션</div>`;
 document.getElementById('act').innerHTML=h;
 document.getElementById('home').style.display='none';
 document.getElementById('act').style.display='block';
 window.scrollTo({top:0,behavior:'smooth'});}
function home(){document.getElementById('act').style.display='none';document.getElementById('home').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function cpy(btn){const tx=btn.parentElement.querySelector('pre').innerText;
 const done=()=>{const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200);const o=btn.textContent;btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent=o,1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(done,()=>fb(tx,done));}else fb(tx,done);}
function fb(tx,done){const t=document.createElement('textarea');t.value=tx;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();}
</script></body></html>
