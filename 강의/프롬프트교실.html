   {title:"후기 요청 메시지",body:"수강생에게 보낼 후기 요청 메시지를 써줘.\n\n- 강의명: [강의명]\n- 후기 남길 곳: [링크/방법]\n\n부담스럽지 않게, 감사 인사와 함께 2~3문장으로. 어떤 점을 적으면 좋은지 살짝 가이드도 넣어줘."}
 ]}
];

var PROMPTS=DEFAULT_PROMPTS;

function slug(i){return 'cat'+i;}
function render(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var nav=document.getElementById('catnav'), list=document.getElementById('list');
  var navHtml='', out='', shown=0;
  PROMPTS.forEach(function(c,ci){
    var items=(c.items||[]).filter(function(it){
      if(!q)return true;
      return ((it.title||'')+' '+(it.body||'')+' '+(c.cat||'')).toLowerCase().indexOf(q)>=0;
    });
    if(!items.length)return;
    shown+=items.length;
    navHtml+='<a href="#'+slug(ci)+'">'+(c.icon||'📌')+' '+esc(c.cat)+'</a>';
    out+='<section class="cat" id="'+slug(ci)+'"><div class="cat-h"><span class="ci">'+(c.icon||'📌')+'</span><h2>'+esc(c.cat)+'</h2><span class="cnt">'+items.length+'개</span></div>';
    items.forEach(function(it){
      var bid='b_'+Math.random().toString(36).slice(2,9);
      out+='<div class="pcard"><div class="ph"><h3>'+esc(it.title)+'</h3>'
        +'<button class="copy-btn" onclick="copyP(this,\''+bid+'\')">복사</button></div>'
        +'<div class="pbody" id="'+bid+'">'+esc(it.body)+'</div></div>';
    });
    out+='</section>';
  });
  nav.innerHTML= q? '' : navHtml;
  list.innerHTML= shown? out : '<div class="empty">검색 결과가 없습니다.</div>';
}
function copyP(btn,id){
  var el=document.getElementById(id); if(!el)return;
  var txt=el.innerText;
  function ok(){var o=btn.textContent;btn.textContent='복사됨 ✓';btn.classList.add('done');setTimeout(function(){btn.textContent=o;btn.classList.remove('done');},1400);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt,ok);});}
  else fallback(txt,ok);
}
function fallback(txt,ok){var t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(e){alert('복사가 지원되지 않는 브라우저입니다.');}document.body.removeChild(t);}

/* 설정 로드 */
fetch(SUPA_URL+'/rest/v1/pbs_site_config?key=eq.prompts_config&select=value',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})
 .then(function(r){return r.json();})
 .then(function(rows){
   if(rows&&rows.length&&rows[0].value&&rows[0].value.length){PROMPTS=rows[0].value;}
   render();
 }).catch(function(){render();});

/* ── 운영자 관리 ── */
function toggleManage(){document.getElementById('mpanel').classList.toggle('open');}
function mUnlock(){
  var v=document.getElementById('mpw').value.trim(), msg=document.getElementById('mpwmsg');
  if(v===MANAGE_PW){msg.textContent='';document.getElementById('mEditor').style.display='block';buildEditor();}
  else{msg.style.color='#C0247E';msg.textContent='비밀번호가 올바르지 않습니다.';}
}
function buildEditor(){
  var ed=document.getElementById('editor'); ed.innerHTML='';
  PROMPTS.forEach(function(c,ci){ ed.appendChild(catNode(c,ci)); });
}
function catNode(c,ci){
  var box=document.createElement('div'); box.className='ecat'; box.dataset.ci=ci;
  var top=document.createElement('div'); top.className='ecat-top';
  top.innerHTML='<input placeholder="아이콘" style="flex:0 0 60px;text-align:center" value="'+esc(c.icon||'')+'" data-f="icon">'
    +'<input placeholder="카테고리 이름" value="'+esc(c.cat||'')+'" data-f="cat">'
    +'<button class="btn del sm" type="button">카테고리 삭제</button>';
  top.querySelector('.del').onclick=function(){box.remove();};
  box.appendChild(top);
  var rows=document.createElement('div'); rows.className='erows';
  (c.items||[]).forEach(function(it){ rows.appendChild(rowNode(it)); });
  box.appendChild(rows);
  var add=document.createElement('button'); add.className='btn ghost sm'; add.type='button'; add.textContent='+ 프롬프트 추가';
  add.onclick=function(){ rows.appendChild(rowNode({title:'',body:''})); };
  box.appendChild(add);
  return box;
}
function rowNode(it){
  var r=document.createElement('div'); r.className='erow';
  var ti=document.createElement('input'); ti.placeholder='프롬프트 제목'; ti.value=it.title||''; ti.dataset.f='title';
  var ta=document.createElement('textarea'); ta.placeholder='프롬프트 내용'; ta.value=it.body||''; ta.dataset.f='body';
  var b=document.createElement('div'); b.className='erow-b';
  var del=document.createElement('button'); del.className='btn del sm'; del.type='button'; del.textContent='삭제'; del.onclick=function(){r.remove();};
  b.appendChild(del); r.appendChild(ti); r.appendChild(ta); r.appendChild(b);
  return r;
}
function addCat(){ document.getElementById('editor').appendChild(catNode({icon:'📌',cat:'새 카테고리',items:[{title:'',body:''}]}, 'new')); }
function collect(){
  var out=[];
  document.querySelectorAll('#editor .ecat').forEach(function(box){
    var icon=box.querySelector('[data-f=icon]').value.trim();
    var cat=box.querySelector('[data-f=cat]').value.trim();
    if(!cat)return;
    var items=[];
    box.querySelectorAll('.erow').forEach(function(r){
      var t=r.querySelector('[data-f=title]').value.trim();
      var b=r.querySelector('[data-f=body]').value.trim();
      if(t||b)items.push({title:t,body:b});
    });
    out.push({icon:icon||'📌',cat:cat,items:items});
  });
  return out;
}
function saveAll(){
  var data=collect(), msg=document.getElementById('saveMsg');
  msg.style.color='#6B6157'; msg.textContent='저장 중…';
  fetch(SUPA_URL+'/rest/v1/pbs_site_config',{
    method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({key:'prompts_config',value:data})
  }).then(function(r){
    if(r.ok){PROMPTS=data;render();msg.style.color='#2E8B57';msg.textContent='✓ 저장 완료! 페이지에 반영되었습니다.';}
    else{r.text().then(function(t){msg.style.color='#C0247E';msg.textContent='저장 실패: '+t.slice(0,120);});}
  }).catch(function(e){msg.style.color='#C0247E';msg.textContent='저장 실패: '+e;});
}
