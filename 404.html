<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 · PBS COLOR LAB</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,#fff6fb 0%,#fdeef6 100%);color:#2b2b2b;
    padding:24px;text-align:center}
  .card{width:100%;max-width:460px}
  .badge{font-size:13px;letter-spacing:2px;color:#e6398a;font-weight:700;margin-bottom:10px}
  h1{font-size:56px;margin:0 0 4px;color:#e6398a;line-height:1}
  h2{font-size:20px;margin:0 0 14px;font-weight:700}
  p{font-size:15px;line-height:1.65;color:#6b6b6b;margin:0 0 24px}
  .btns{display:flex;flex-direction:column;gap:10px}
  a.btn{display:block;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:700;font-size:16px}
  .primary{background:#e6398a;color:#fff}
  .ghost{background:#fff;color:#333;border:1.5px solid #f0cfe0}
  .count{margin-top:20px;font-size:13px;color:#a98}
  @media(min-width:520px){.btns{flex-direction:row;flex-wrap:wrap}a.btn{flex:1 1 45%}}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">PBS COLOR LAB</div>
    <h1>404</h1>
    <h2>페이지 주소가 바뀌었어요</h2>
    <p>찾으시는 페이지가 이동되었거나 주소가 변경되었습니다.<br>아래에서 바로 이동하실 수 있어요.</p>
    <div class="btns">
      <a class="btn primary" href="/">🏠 홈으로</a>
      <a class="btn ghost" href="/shop/pc-paperboard.html">🎨 교구 스토어</a>
      <a class="btn ghost" href="/강의/">📚 강의 안내</a>
      <a class="btn ghost" href="/downloads/최해숙_대표_프로필.pdf">📄 대표 프로필</a>
    </div>
    <div class="count">잠시 후 홈으로 자동 이동합니다… (<span id="s">5</span>초)</div>
  </div>
<script>
  var n=5,el=document.getElementById('s');
  var t=setInterval(function(){n--;if(el)el.textContent=n;if(n<=0){clearInterval(t);location.replace('/');}},1000);
</script>
</body>
</html>
