<style>
:root{--bg:#fbfbfa;--panel:#fff;--tint:#f4f5f7;--tint2:#f8f6f4;--ink:#23272e;--head:#1b1e24;--muted:#71767e;--faint:#9aa0a7;--line:#ececeb;--line2:#e3e3e1;--accent:#c21f6a;--accent-ink:#a41858;--accent-soft:#fbeef4;--accent-line:#f1d6e2;--navy:#232830}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;word-break:keep-all;line-height:1.75;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.bar{height:3px;background:linear-gradient(90deg,#d0574f 0 25%,#e0b23e 25% 50%,#3f8f6c 50% 75%,#3f6ea6 75%);opacity:.85}
nav{height:70px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);display:flex;align-items:center;padding:0 6vw;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:30}
nav img{height:30px;cursor:pointer}.nav-sp{margin-left:auto}
nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-left:22px}nav a:hover{color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(180deg,#f5f6f8,var(--bg));padding:74px 0 60px;border-bottom:1px solid var(--line)}
.hero .tag{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700;text-transform:uppercase}
.hero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.2;letter-spacing:-.035em;font-weight:700;color:var(--head);margin:16px 0 16px}
.hero p{color:var(--muted);max-width:640px;font-size:16.5px}
.sec{padding:66px 0}
.sec.alt{background:var(--tint)}
.cimg{aspect-ratio:1200/560;border-radius:12px;background-size:cover;background-position:center;margin-bottom:16px}
.cimg.noimg{}
.cat-inner{background:linear-gradient(135deg,#2b3440,#46586c)}
.cat-strength{background:linear-gradient(135deg,#37639a,#5f8bc0)}
.cat-outer{background:linear-gradient(135deg,#b01f63,#dc5f96)}
.cat-instructor{background:linear-gradient(135deg,#2b3440,#46586c)}
.dimg{aspect-ratio:1200/560;border-radius:16px;background-size:cover;background-position:center;margin-bottom:26px}
.ice{max-width:560px;margin:30px 0 0}
.ice .tier{border-radius:12px;padding:16px 20px;margin-bottom:8px;color:#fff}
.ice .tier b{font-size:15px;font-weight:700;display:block}
.ice .tier span{font-size:13px;opacity:.92}
.ice .t-in{background:var(--navy)}
.ice .t-str{background:#3f6ea6}
.ice .t-out{background:var(--accent)}
.ki{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h2{font-size:clamp(23px,3.2vw,30px);letter-spacing:-.03em;font-weight:700;color:var(--head);margin:0 0 14px;line-height:1.32}
.lead{color:var(--muted);font-size:16px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;transition:.15s}
.cc:hover{border-color:var(--accent-line);box-shadow:0 18px 40px -28px rgba(35,40,48,.35)}
.cc .ct{font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:3px 11px;align-self:flex-start;letter-spacing:.02em}
.cc h3{font-size:18px;font-weight:700;color:var(--head);margin:14px 0 4px;line-height:1.35}
.cc .mth{font-size:12.5px;color:var(--faint);margin-bottom:10px}
.cc p{font-size:13.5px;color:var(--muted);margin:0 0 16px;flex:1;line-height:1.7}
.cc .price{font-size:20px;font-weight:700;color:var(--head);letter-spacing:-.02em;margin-bottom:14px}
.cc .price small{font-size:13px;color:var(--muted);font-weight:500}
.cc a.go{text-decoration:none;text-align:center;font-weight:600;border-radius:10px;padding:12px;background:var(--ink);color:#fff;font-size:14px}
.cc a.go:hover{background:#000}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:18px}
.back:hover{color:var(--ink)}
.dhead{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:26px}
.dhead .ct{font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:3px 11px;display:inline-block}
.dhead h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;color:var(--head);letter-spacing:-.03em;margin:14px 0 8px}
.dhead .meta{color:var(--muted);font-size:14px}
.dhead .price{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-.02em;margin-top:14px}
.dhead .price small{font-size:14px;color:var(--muted);font-weight:500}
.ctabtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.ctabtn{flex:1;min-width:180px;text-align:center;padding:15px 20px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid var(--accent);transition:.15s}.ctabtn.solid{background:var(--accent);color:#fff}.ctabtn.solid:hover{filter:brightness(.94)}.ctabtn.ghost{background:#fff;color:var(--accent-ink)}.ctabtn.ghost:hover{background:var(--accent-soft)}.payrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}.payopt{flex:1;min-width:150px;display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:15px;font-weight:600;color:var(--head);background:#fff}.payopt input{width:18px;height:18px;accent-color:var(--accent)}.payopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.paynote{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}.paynote b{color:var(--accent-ink)}
.dintro{font-size:16px;color:#43474e;line-height:1.9;margin-bottom:28px}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.blk h4{font-size:13px;font-weight:700;color:var(--accent-ink);letter-spacing:.02em;margin:0 0 12px;text-transform:uppercase}
.blk ul{list-style:none;padding:0;margin:0}
.blk li{font-size:13.5px;color:#4a4e55;padding:6px 0 6px 18px;position:relative;line-height:1.7}
.blk li:before{content:'';position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.blk.full{grid-column:1/-1}
/* terms */
.termsbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;max-height:340px;overflow-y:auto;margin-top:16px;font-size:13.5px;color:#454951;line-height:1.85}
.termsbox .tt{font-size:15px;font-weight:700;color:var(--head);margin:0 0 4px}
.termsbox .intro{color:var(--muted);font-size:13px;margin:0 0 14px}
.termsbox h5b{display:block;font-size:13.5px;color:var(--accent-ink);font-weight:700;margin:16px 0 5px}
.termsbox h6b{display:block;font-size:13.5px;color:var(--head);font-weight:700;margin:11px 0 3px}
.termsbox p{margin:3px 0}
.termsbox .end{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.agreewrap{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:18px 20px;margin-top:16px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#43474e;line-height:1.7}
.agree input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.sigrow{margin-top:14px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#43474e}
.fld input,.fld textarea{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:15px;background:#fff}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--accent)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.paybox{background:var(--tint2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:18px 20px;margin:22px 0;font-size:14px;color:#43474e;line-height:1.8}
.paybox b{color:var(--head)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;margin-top:22px;box-shadow:0 20px 50px -34px rgba(35,40,48,.28)}
form.form.locked{opacity:.55;pointer-events:none;filter:grayscale(.25)}
.lockmsg{font-size:13px;color:var(--muted);margin:14px 0 0}
.btn{display:block;width:100%;text-align:center;font-weight:600;border-radius:10px;padding:15px;font-size:15px;cursor:pointer;border:0;background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
#formmsg{min-height:20px;font-size:13px;margin-top:12px}
.done{display:none;background:#eef5f1;border:1px solid #d3e6db;border-radius:16px;padding:30px;text-align:center;margin-top:22px}
.done h3{color:#25694c;margin:0 0 10px}.done p{color:#3a5a4c;margin:4px 0}
footer{background:var(--navy);color:#fff;padding:52px 0;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
footer .wm2{font-size:19px;font-weight:700}footer p{color:#9aa0a8;font-size:13px;margin:8px 0 0;line-height:1.8}
.hidden{display:none}
@media(max-width:760px){.grid,.blocks{grid-template-columns:1fr}.fg2{grid-template-columns:1fr}nav a{margin-left:14px}.sec{padding:48px 0}}

var TERMS='<div class="termsbox"><p class="tt">［공통］PBS컬러랩 인증센터 표준 수강 규약</p>'+
'<p class="intro">본 규약은 PBS컬러랩 본사(“본사”)가 주관하고 인증센터(“교육기관”)가 운영하는 모든 교육과정(“본 과정”)의 수강 및 자격 취득에 관한 사항을 규정합니다. 수강 신청 및 교육비 납부는 본 규약에 대한 동의로 간주됩니다.</p>'+
'<h5b>제1장 총칙</h5b>'+
'<h6b>제1조 (목적)</h6b><p>본 규약은 수강 계약의 성립, 교육 운영, 자격 시험 및 발급 기준, 환불 기준, 지식재산권 보호, 자격 취득자의 권리와 의무를 명확히 함을 목적으로 합니다.</p>'+
'<h6b>제2조 (법적 지위 및 적용 원칙)</h6b><p>1. 본 과정은 「학원의 설립·운영 및 과외교습에 관한 법률」상 학원에 해당하지 않는 민간 전문 자격 및 교육과정입니다.<br>2. 본 규약은 관련 법령을 준수하는 범위 내에서 적용되며, 법령에서 별도로 정하지 않은 사항은 본 규약을 우선 적용합니다.<br>3. 관련 법령의 강행규정과 충돌하는 부분은 해당 부분에 한하여 법령을 따릅니다.<br>4. 개별 과정 안내문·별도 계약서·서면 합의가 있는 경우 그 내용이 본 규약에 우선할 수 있습니다.</p>'+
'<h6b>제3조 (용어의 정의)</h6b><p>1. “수강생”이란 본 규약에 동의하고 수강 계약을 체결한 자를 말합니다.<br>2. “자격인증자”란 본 과정을 수료하고 소정의 시험·절차를 통과하여 본사로부터 자격을 부여받은 자를 말합니다.<br>3. “본 저작물 등”이란 교재·강의자료·진단 로직·평가 기준·시스템 구조·데이터 및 노하우 등 본 과정과 관련된 모든 지식재산을 말합니다.</p>'+
'<h5b>제2장 수강 계약 및 교육 운영</h5b>'+
'<h6b>제4조 (수강 계약의 성립)</h6b><p>수강 계약은 신청자가 본 규약에 동의하고 교육기관이 정한 기한 내 수강료를 납부함으로써 성립합니다.</p>'+
'<h6b>제5조 (출석 및 수료 기준)</h6b><p>1. 전체 교육 시간의 80% 이상 출석을 수료 기준으로 합니다.<br>2. 지각·조퇴·중도 이탈은 운영 방침에 따라 출석 불인정 또는 감점 처리될 수 있습니다.<br>3. 강사의 정당한 지시 불이행, 수업 방해, 타 수강생 권익 침해, 상업적 홍보·포교 등 교육 질서를 현저히 저해하는 경우 즉시 수강이 중단될 수 있으며 이 경우 수강료는 환불되지 않습니다.<br>4. 원데이 과정은 출석 수료가 아닌 참여 완료를 기준으로 인정합니다.</p>'+
'<h5b>제3장 자격 시험 및 발급 기준</h5b>'+
'<h6b>제6조 (자격증 발급 요건)</h6b><p>다음을 모두 충족한 경우에 한해 자격증이 발급됩니다. 1. 전체 교육의 80% 이상 출석·이수 / 2. 자격 시험 70점 이상 합격 / 3. 신분증을 통한 본인 확인 / 4. 지식재산권 보호 서약서 작성·서명 제출 / 5. 수강료 및 자격 관련 비용 전액 완납. 요건 미충족 시 발급이 거절·유보될 수 있습니다.</p>'+
'<h6b>제7조 (부정행위 및 자격 취소)</h6b><p>다음의 경우 자격이 무효·취소될 수 있습니다. 1. 시험지 촬영·녹음·문제 외부 공유 / 2. 대리 응시 등 본인 아닌 자의 시험 관여 / 3. 교육 콘텐츠·로직의 무단 복제·배포·재전수 / 4. 허위 경력 기재 등 부정한 자격 취득 / 5. 본사 브랜드 가치의 중대한 훼손 또는 전문가 윤리 위반.</p>'+
'<h5b>제4장 수강료 및 환불 규정</h5b>'+
'<h6b>제8조 (비용의 구성)</h6b><p>1. 강의료(교육기관 소관) / 2. 자격 응시료·인증료(본사 소관) / 3. 교재 및 재료비.</p>'+
'<h6b>제9조 (환불 기준)</h6b><p>1. 강의료 환불(교육기관): 개강 10일 전 90% · 3일 전 70% · 2일 전 50% · 개강 당일 및 이후 불가.<br>2. 인증료 환불(본사): 교재 발송 전 100% · 발송 후 70%(교재 훼손 시 50%) · 개강 2일 전 50% · 개강 당일 및 이후 불가(로열티 소멸).<br>3. 일정 변경·이월은 개강 3일 전까지 1회 협의 가능하며, 노쇼 시 환불·이월 불가.<br>4. 모든 환불 신청은 접수 기관(교육기관)을 통해 진행되며, 인증료 환불은 본사 기준에 따릅니다.</p>'+
'<h5b>제5장 지식재산권 및 금지 사항</h5b>'+
'<h6b>제10조 (지식재산권의 귀속 및 사용 제한)</h6b><p>1. 본 과정에서 제공되는 모든 저작물·로직의 권리는 본사에 귀속됩니다.<br>2. 수강생·자격인증자는 상업적 목적의 유무를 불문하고 본사의 사전 서면 승인 없이 본 저작물을 복제·배포·개작할 수 없습니다.<br>3. 자격 취득 후에도 별도 라이선스 계약 없이 본 로직으로 유사 과정을 개설하거나 강사를 양성하는 재전수 행위는 엄격히 금지됩니다.</p>'+
'<h6b>제11조 (비밀 유지 의무)</h6b><p>수강생은 교육 과정에서 취득한 본사의 기술 정보·영업 비밀 및 타인의 개인정보를 외부에 누설하거나 목적 외로 사용할 수 없으며, 위반하여 손해를 끼친 경우 배상 책임이 발생합니다.</p>'+
'<h5b>제6장 자격인증자의 권리와 의무</h5b>'+
'<h6b>제12조 (권리 및 특전)</h6b><p>정식 자격 취득자는 본사 가이드라인에 따라 다음 권리를 가집니다. 1. 공식 자격 명칭 사용권 / 2. 본사 메소드를 이용한 개인 대상 진단·컨설팅 제공 권한 / 3. 보수 교육 및 상위 과정 우선 참여권 / 4. 인증센터 개설 신청 자격(별도 심사·계약 필요) / 5. 본사 네트워크 활용 및 대외 협업 참여 신청 자격.</p>'+
'<h6b>제13조 (의무)</h6b><p>1. 본사의 브랜드 가치와 전문가 윤리 기준을 준수합니다.<br>2. 자격 미보유 제3자에게 관련 업무를 위탁하거나 핵심 로직을 공유할 수 없습니다.<br>3. 본사를 공식 대리인으로 오인하게 하는 표현을 사용할 수 없습니다.</p>'+
'<h5b>제7장 기타 사항</h5b>'+
'<h6b>제14조 (면책 및 손해배상)</h6b><p>1. 본 과정은 전문가 교육 제공을 목적으로 하며, 교육 내용·정보의 완전성·유용성 및 자격 취득 후 개인의 사업 성과·수익·결과 등을 보증하거나 책임지지 않습니다.<br>2. 규약 위반으로 손해를 발생시킨 경우 해당 수강생이 배상 책임을 집니다.<br>3. 본 규약상 지위·권리·의무는 제3자에게 양도·승계·처분할 수 없습니다.</p>'+
'<h6b>제15조 (개인정보 수집 및 제3자 제공 동의)</h6b><p>1. 자격 발급·수강 관리를 위해 성명·연락처·생년월일 등을 수집합니다.<br>2. 수집 정보는 자격 관리 기관인 본사에 제공되며, 동의하지 않을 경우 자격증 발급이 제한됩니다.</p>'+
'<h6b>제16조 (초상권 및 결과물 활용)</h6b><p>수업 중 촬영된 사진·영상은 홍보 및 연구 자료로 활용될 수 있으며, 제출된 과제물은 비식별화 처리 후 교육 사례로 활용될 수 있습니다.</p>'+
