<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>5회차 · 현장 체험 (2) | 퍼스널컬러 트레이닝</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="퍼스널컬러 트레이닝 5회차 — 두 번째 현장 체험으로 몸에 익힙니다." />
<meta property="og:title" content="5회차 · 현장 체험 (2) | 퍼스널컬러 트레이닝" />
<meta property="og:description" content="퍼스널컬러 트레이닝 5회차 — 두 번째 현장 체험으로 몸에 익힙니다." />
<meta property="og:image" content="https://www.pbscolor.com/assets/common/pbs-logo.png" />
<style>
:root{--mg:#E5007F;--mg-d:#C2185B;--mg-s:#FFF0F7;--gold:#B99239;--ink:#1b1b1f;--ink2:#4a4a52;--ink3:#8a8a92;--line:#e6e6ea;--bg:#f7f7f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;padding-bottom:44px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.top .dot{width:24px;height:24px;border-radius:50%;background:var(--mg);flex:0 0 auto}
.top a.back{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:700;flex:0 0 auto}
.top b{font-size:14.5px}.top small{display:block;color:var(--ink3);font-size:11.5px;font-weight:600}
.top .ti{font-size:14px;font-weight:800;color:var(--ink2)}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px}
.hero{padding:10px 2px 20px}
.hero .eb{display:inline-block;background:var(--mg-s);color:var(--mg-d);font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 12px;margin-bottom:10px;letter-spacing:.04em}
.hero h1{margin:0 0 9px;font-size:26px;line-height:1.3;letter-spacing:-.02em}
.hero h1 span{color:var(--mg)}
.hero p{margin:0;color:var(--ink2);font-size:14.5px}
.sec{margin:26px 0 10px;font-size:12.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.grid{display:grid;gap:11px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
a.course,div.course{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 16px;text-decoration:none;color:inherit;position:relative}
a.course:hover{border-color:var(--mg);box-shadow:0 2px 12px rgba(229,0,127,.08)}
.course .ic{font-size:24px;line-height:1;margin-bottom:9px}
.course h3{margin:0 0 5px;font-size:17.5px;letter-spacing:-.01em}
.course p{margin:0;color:var(--ink2);font-size:13.8px}
.course .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px;background:#eef2f8;border:1px solid #dce4ef;color:#3f4a5c}
.tag.mg{background:var(--mg-s);border-color:#f6c9e0;color:var(--mg-d)}
.tag.gd{background:#fdf6e6;border-color:#eedfb6;color:#8a6b16}
.course .enter{display:inline-block;margin-top:11px;color:var(--mg);font-size:13.5px;font-weight:800}
.course.soon{opacity:.6}
.course.soon .enter{color:var(--ink3)}
.rn{display:flex;align-items:center;gap:10px}
.rnum{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--mg);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rnum.soft{background:var(--mg-s);color:var(--mg-d)}
.hd{background:linear-gradient(135deg,#E5007F,#B0135F);color:#fff;border-radius:18px;padding:22px 18px;margin-bottom:16px}
.hd .eb{display:inline-block;background:rgba(255,255,255,.2);font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 12px;margin-bottom:10px}
.hd h1{margin:0 0 10px;font-size:24px;line-height:1.3;letter-spacing:-.02em}
.hd .meta{display:flex;flex-wrap:wrap;gap:7px}
.hd .meta span{background:rgba(255,255,255,.16);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .ic2{width:24px;height:24px;border-radius:7px;background:var(--mg-s);color:var(--mg-d);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
.card .hint{margin:0 0 14px;color:var(--ink3);font-size:13px}
.goal{background:var(--mg-s);border:1px solid #f6c9e0;border-radius:12px;padding:14px;font-size:15.5px;font-weight:700;color:#8a1259;line-height:1.55}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #f2f2f5}
ol.steps li:last-child{border-bottom:0;padding-bottom:0}
ol.steps li::before{content:counter(s);flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--mg);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
ol.steps b{display:block;font-size:15px}
ol.steps p{margin:3px 0 0;color:var(--ink2);font-size:13.5px}
.mat{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px 13px;background:#fff;margin-bottom:8px}
.mat .mi{font-size:20px;flex:0 0 auto}
.mat b{display:block;font-size:14.5px}
.mat small{display:block;color:var(--ink3);font-size:12.5px;font-weight:600}
.mat .st{margin-left:auto;font-size:11.5px;font-weight:800;border-radius:7px;padding:4px 9px;background:#f4f4f6;border:1px solid #e2e2e8;color:#77777f;white-space:nowrap}
.empty{border:1.5px dashed #dcdce2;border-radius:12px;padding:16px;color:var(--ink3);font-size:13.5px;text-align:center;line-height:1.6}
.note{background:#fafafb;border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--ink2);font-size:12.8px;margin-top:12px}
.rep{display:block;background:var(--mg);color:#fff;border-radius:16px;padding:18px 16px;text-decoration:none;margin-bottom:12px}
.rep b{display:block;font-size:17px;margin-bottom:4px}
.rep span{font-size:13.5px;opacity:.92}
.nav2{display:flex;gap:9px}
.nav2 a{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-decoration:none;color:inherit;text-align:center}
.nav2 a:hover{border-color:var(--mg)}
.nav2 a small{display:block;color:var(--ink3);font-size:11.5px;font-weight:800;margin-bottom:3px}
.nav2 a b{font-size:13.8px}
.nav2 a.off{opacity:.45;pointer-events:none}
.foot{text-align:center;color:var(--ink3);font-size:12px;padding:24px 0 6px}
@media(min-width:640px){.hero h1{font-size:30px}.hd h1{font-size:27px}}
</style>
</head>
<body>
<div class="top"><a class="back" href="class299.html">← 회차 목록</a><span class="ti">5회차</span></div>
<div class="wrap">
<div class="hd">
  <span class="eb">퍼스널컬러 트레이닝 · 5회차</span>
  <h1>현장 체험 (2)</h1>
  <div class="meta"><span>일정 개별 안내</span></div>
</div>

<div class="card">
  <h2><span class="ic2">◎</span>이번 회차 목표</h2>
  <p class="hint">이것만 되면 이번 회차는 성공입니다.</p>
  <div class="goal">첫 현장에서 받은 피드백을 반영해 스스로 움직인다.</div>
</div>

<div class="card">
  <h2><span class="ic2">1</span>이번 회차에 하는 일</h2>
  <p class="hint">순서대로 진행합니다.</p>
  <ol class="steps">
      <li><div><b>현장 체험</b><p>4회차 피드백을 반영해 다시 현장에 참여합니다.</p></div></li>
  </ol>
</div>

<div class="card">
  <h2><span class="ic2">✓</span>마치고 할 일</h2>
  <p class="hint">교육이 끝나면 잊지 말고 남겨주세요.</p>
  <a class="rep" href="../report.html"><b>회차 리포트 제출 →</b><span>회차 소감 · (교구 받았으면) 인수확인 서명 · 2~3분</span></a>
  <div class="nav2"><a href="round4.html"><small>이전</small><b>4회차</b></a><a href="round6.html"><small>다음</small><b>6회차</b></a></div>
</div>

<div class="foot">PBS COLOR LAB · 인증강사 트레이닝</div>
</div>
</body>
</html>
