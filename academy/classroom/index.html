<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의실 입장 | PBS COLOR LAB 아카데미</title>
<meta name="description" content="PBS COLOR LAB 아카데미 온라인 강의실입니다. 수강 중인 과정의 라이브·녹화 강의와 학습 자료를 이곳에서 만나실 수 있습니다.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.pbscolor.com/academy/classroom">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1216;color:#e7e9ee;font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Arial,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px}
  .card{max-width:560px;width:100%;text-align:center;background:#181a1f;border:1px solid #2a2f3a;border-radius:20px;padding:48px 34px}
  .badge{display:inline-block;font-size:12.5px;letter-spacing:.14em;color:#ff5cae;border:1px solid rgba(229,0,122,.5);border-radius:999px;padding:7px 15px;margin-bottom:22px;font-weight:700}
  .ico{font-size:44px;margin-bottom:10px}
  h1{font-size:26px;font-weight:900;line-height:1.4;margin-bottom:14px}
  h1 em{font-style:normal;color:#e5007a}
  p{color:#c9ccd2;font-size:15px;margin-bottom:8px}
  .sub{font-size:13.5px;color:#8b909a;margin-top:16px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
  a.btn{text-decoration:none;font-weight:700;font-size:14.5px;border-radius:11px;padding:13px 20px;transition:.15s}
  a.primary{background:#e5007a;color:#fff}
  a.primary:hover{background:#ff2e93}
  a.ghost{border:1px solid #2a2f3a;color:#e7e9ee}
  a.ghost:hover{border-color:#4a4f5a}
  footer{text-align:center;padding:22px;color:rgba(255,255,255,.4);font-size:12.5px;border-top:1px solid #1e2128}
  footer a{color:rgba(255,255,255,.55);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="badge">CLASSROOM</span>
      <div class="ico">🎓</div>
      <h1>온라인 강의실을 <em>준비하고 있습니다</em></h1>
      <p>수강 중인 과정의 라이브·녹화 강의와 학습 자료를</p>
      <p>이곳에서 편리하게 이용하실 수 있도록 준비 중입니다.</p>
      <p class="sub">강의실 오픈 일정과 입장 안내는 수강 신청하신 분께 개별 안내드립니다.</p>
      <div class="btns">
        <a class="btn primary" href="/academy">아카데미 홈으로</a>
        <a class="btn ghost" href="/academy#contact">수강 상담 문의</a>
      </div>
    </div>
  </div>
  <footer>
    © PBS COLOR LAB 아카데미 · <a href="/academy">아카데미 홈</a> · <a href="https://www.pbscolor.com/">PBS COLOR LAB</a>
  </footer>
</body>
</html>
