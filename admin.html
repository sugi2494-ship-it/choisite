<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PBS COLOR LAB 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#110b20;--card:#211735;--line:#44325f;--pink:#e6007e;--gold:#d9b86c;--text:#fff;--muted:#b9adc9}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#110b20,#261238);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh}
    button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.panel{background:rgba(33,23,53,.96);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
    h1,h2{margin:0 0 16px}.muted{color:var(--muted);line-height:1.6}.login{max-width:430px;margin:9vh auto}.field{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#120c1f;color:#fff;margin:7px 0}
    .btn{border:0;border-radius:999px;padding:11px 18px;color:#fff;background:var(--pink);font-weight:800;cursor:pointer}.btn.sub{background:#514066}.btn.danger{background:#8c2948}.btn:disabled{opacity:.55;cursor:wait}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#39294d}.tab.on{background:var(--pink)}
    .status{min-height:22px;margin-top:10px;color:#ff9fcf}.list{display:grid;gap:12px}.card{background:#180f28;border:1px solid var(--line);border-radius:15px;padding:17px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:900}.date{font-size:12px;color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{font-size:12px;padding:5px 9px;background:#332348;border-radius:999px}.msg{white-space:pre-wrap;line-height:1.65;color:#eee;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.empty{text-align:center;color:var(--muted);padding:35px}
    .badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#6b4f21;color:#ffe19a}.badge.ok{background:#174b37;color:#91ffd0}.photo{max-width:130px;max-height:130px;border-radius:10px;margin-top:10px;object-fit:cover}
    [hidden]{display:none!important}@media(max-width:650px){.top,.head{align-items:stretch;flex-direction:column}.panel{padding:18px}.wrap{padding:16px 10px}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView" class="panel login">
      <h1>PBS 관리자 로그인</h1>
      <p class="muted">등록된 관리자 이메일과 비밀번호로 로그인하세요. 비밀번호는 이 페이지에 저장되지 않습니다.</p>
      <form id="loginForm">
        <label>이메일<input id="email" class="field" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="password" class="field" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" class="btn" type="submit">로그인</button>
      </form>
      <div id="loginStatus" class="status" role="status"></div>
    </section>

    <section id="adminView" hidden>
      <div class="top">
        <div><h1>PBS COLOR LAB 관리자</h1><div id="adminEmail" class="muted"></div></div>
        <div><button id="refreshBtn" class="btn sub">새로고침</button> <button id="logoutBtn" class="btn">로그아웃</button></div>
      </div>
      <div class="tabs" role="tablist">
        <button class="btn tab on" data-tab="inquiries">문의 <span id="inqCount"></span></button>
        <button class="btn tab" data-tab="testimonials">소감 <span id="testiCount"></span></button>
      </div>
      <section id="inquiriesPane" class="panel"><h2>문의 관리</h2><div id="inquiries" class="list"></div></section>
      <section id="testimonialsPane" class="panel" hidden><h2>소감 관리</h2><div id="testimonials" class="list"></div></section>
      <div id="adminStatus" class="status" role="status"></div>
    </section>
  </main>
  <script>
    'use strict';
    const SUPABASE_URL='https://oqxlsnyuwtmjmbhgzjoz.supabase.co';
    const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xeGxzbnl1d3Rtam1iaGd6am96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NTc5NDksImV4cCI6MjA5MjMzMzk0OX0.C-PPch12eVru2xhuU80WPYdBj5CJb1Py8m1-OsaGZW8';
    const ADMIN_EMAIL='sugi2494@gmail.com';
    const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeUrl=v=>{try{const u=new URL(String(v||''),location.href);return ['https:','data:'].includes(u.protocol)?u.href:''}catch{return ''}};
    const fmt=v=>v?new Date(v).toLocaleString('ko-KR'):'날짜 없음';
    const REPLY_TPL=name=>`${name||''}님 안녕하세요, PBS컬러랩 최해숙입니다. 소중한 문의 감사드립니다. 남겨주신 내용 잘 확인했습니다. 편하신 시간에 상담 도와드릴게요. 궁금한 점은 언제든 이 번호로 연락 주세요. 감사합니다.`;
    function _cpFallback(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}document.body.removeChild(a)}
    function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>_cpFallback(t))}else{_cpFallback(t)}}
    function setStatus(msg,error=false){$('adminStatus').textContent=msg;$('adminStatus').style.color=error?'#ff9fcf':'#91ffd0'}
    async function requireAdmin(){
      const {data:{session}}=await db.auth.getSession();
      const email=(session?.user?.email||'').toLowerCase();
      if(!session||email!==ADMIN_EMAIL){if(session)await db.auth.signOut();showLogin();return false}
      $('adminEmail').textContent=email;$('loginView').hidden=true;$('adminView').hidden=false;return true;
    }
    function showLogin(){$('adminView').hidden=true;$('loginView').hidden=false;$('email').value=ADMIN_EMAIL}
    $('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();const btn=$('loginBtn');btn.disabled=true;$('loginStatus').textContent='로그인 확인 중…';
      const email=$('email').value.trim().toLowerCase();
      if(email!==ADMIN_EMAIL){$('loginStatus').textContent='등록된 관리자 이메일만 사용할 수 있습니다.';btn.disabled=false;return}
      const {error}=await db.auth.signInWithPassword({email,password:$('password').value});
      $('password').value='';btn.disabled=false;
      if(error){$('loginStatus').textContent='로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.';return}
      $('loginStatus').textContent='';if(await requireAdmin())await loadAll();
    });
    $('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();showLogin()});
    $('refreshBtn').addEventListener('click',loadAll);
    document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{
      document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===btn));
      $('inquiriesPane').hidden=btn.dataset.tab!=='inquiries';$('testimonialsPane').hidden=btn.dataset.tab!=='testimonials';
    }));
    async function loadAll(){
      if(!await requireAdmin())return;setStatus('자료를 불러오는 중…');
      const [inq,tst]=await Promise.all([
        db.from('pbs_inquiries').select('*').order('created_at',{ascending:false}),
        db.from('pbs_testimonials').select('*').order('created_at',{ascending:false})
      ]);
      if(inq.error||tst.error){setStatus('자료를 불러오지 못했습니다. 관리자 로그인과 RLS 정책을 확인하세요.',true);return}
      renderInquiries(inq.data||[]);renderTestimonials(tst.data||[]);setStatus('최신 자료를 불러왔습니다.');
    }
    function renderInquiries(rows){
      $('inqCount').textContent='('+rows.length+')';
      $('inquiries').innerHTML=rows.length?rows.map(x=>{
        const ph=(x.phone||'').replace(/[^0-9+]/g,'');
        const tpl=REPLY_TPL(x.name);
        const gmail='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(x.email||'')+'&su='+encodeURIComponent('PBS COLOR LAB 문의 답변')+'&body='+encodeURIComponent(tpl);
        return `<article class="card"><div class="head"><div class="name">${esc(x.name||'이름 없음')}</div><div class="date">${esc(fmt(x.created_at))}</div></div><div class="chips">${x.phone?`<span class="chip">전화 ${esc(x.phone)}</span>`:''}${x.email?`<span class="chip">이메일 ${esc(x.email)}</span>`:''}${x.country?`<span class="chip">지역 ${esc(x.country)}</span>`:''}${x.org?`<span class="chip">기관 ${esc(x.org)}</span>`:''}${x.sns?`<span class="chip">SNS ${esc(x.sns)}</span>`:''}</div><div class="msg">${esc(x.msg)}</div><div class="actions">${ph?`<a class="btn sub" href="tel:${ph}">📞 전화</a>`:''}${ph?`<a class="btn sub" href="sms:${ph}?body=${encodeURIComponent(tpl)}">📱 문자</a>`:''}${ph?`<button class="btn sub" data-kakao="${esc(x.name||'')}">💬 톡</button>`:''}${x.email?`<a class="btn sub" target="_blank" rel="noopener" href="${gmail}">✉ Gmail</a>`:''}<button class="btn danger" data-delete-inquiry="${esc(x.id)}">삭제</button></div></article>`;
      }).join(''):'<div class="empty">등록된 문의가 없습니다.</div>';
    }
    function renderTestimonials(rows){
      $('testiCount').textContent='('+rows.length+')';
      $('testimonials').innerHTML=rows.length?rows.map(x=>{const img=safeUrl(x.photo);return `<article class="card"><div class="head"><div class="name">${esc(x.name||'익명')} <span class="badge ${x.approved?'ok':''}">${x.approved?'게시 중':'미승인'}</span></div><div class="date">${esc(x.date||fmt(x.created_at))}</div></div><div class="msg">${esc(x.msg)} ${'★'.repeat(Math.max(0,Math.min(5,Number(x.star)||0)))}</div>${img?`<img class="photo" src="${esc(img)}" alt="방문자 소감 첨부 사진">`:''}<div class="actions"><button class="btn sub" data-toggle-testimonial="${esc(x.id)}" data-approved="${x.approved?'1':'0'}">${x.approved?'게시 중지':'게시 승인'}</button><button class="btn danger" data-delete-testimonial="${esc(x.id)}">삭제</button></div></article>`}).join(''):'<div class="empty">등록된 소감이 없습니다.</div>';
    }
    document.addEventListener('click',async e=>{
      const inq=e.target.closest('[data-delete-inquiry]');
      if(inq&&confirm('이 문의를 삭제할까요?')){const {error}=await db.from('pbs_inquiries').delete().eq('id',inq.dataset.deleteInquiry);if(error)setStatus('문의 삭제 실패',true);else await loadAll()}
      const del=e.target.closest('[data-delete-testimonial]');
      if(del&&confirm('이 소감을 삭제할까요?')){const {error}=await db.from('pbs_testimonials').delete().eq('id',del.dataset.deleteTestimonial);if(error)setStatus('소감 삭제 실패',true);else await loadAll()}
      const tog=e.target.closest('[data-toggle-testimonial]');
      if(tog){const approved=tog.dataset.approved!=='1';const {error}=await db.from('pbs_testimonials').update({approved}).eq('id',tog.dataset.toggleTestimonial);if(error)setStatus('소감 상태 변경 실패',true);else await loadAll()}
      const kk=e.target.closest('[data-kakao]');
      if(kk){copyText(REPLY_TPL(kk.dataset.kakao));try{window.location.href='kakaotalk://'}catch(_){}setStatus('톡 문구를 복사했습니다. 카카오톡을 열어 상대에게 붙여넣기 하세요.')}
    });
    db.auth.onAuthStateChange(()=>setTimeout(requireAdmin,0));
    document.addEventListener('DOMContentLoaded',async()=>{showLogin();if(await requireAdmin())await loadAll()});
  </script>
</body>
</html>
