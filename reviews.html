<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수강생 후기 모음｜최해숙 PBS COLOR LAB</title>
<meta name="description" content="PBS COLOR LAB 최해숙 대표의 강의·컬러콘서트·자격과정에 참여한 분들이 직접 남긴 후기 모음. 퍼스널컬러·컬러강점 교육 현장의 생생한 이야기.">
<link rel="canonical" href="https://www.pbscolor.com/reviews.html">
<meta property="og:type" content="website">
<meta property="og:title" content="수강생 후기 모음｜PBS COLOR LAB">
<meta property="og:description" content="강의 현장에서 직접 남긴 후기를 모았습니다.">
<meta property="og:url" content="https://www.pbscolor.com/reviews.html">
<meta property="og:image" content="https://www.pbscolor.com/og-main.jpg?v=3">
<link rel="icon" href="/assets/pbs-logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;background:#FAF7F5;color:#17131B;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hd{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #ECE5E9}
.hd-in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.14em;font-size:13px}
.brand img{width:28px;height:28px}
.hd .back{font-size:14px;font-weight:700;color:#4B4651}
.wrap{max-width:1100px;margin:0 auto;padding:56px 20px 90px}
.kick{font-size:12.5px;letter-spacing:.22em;color:#6F6975;font-weight:700}
h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-.03em;margin:10px 0 12px}
.lead{font-size:17px;color:#4B4651;line-height:1.7}
.sum{display:flex;align-items:center;gap:18px;margin:30px 0 34px;padding:22px 24px;background:#fff;border:1px solid #ECE5E9;border-radius:20px;flex-wrap:wrap}
.sum b{font-size:44px;font-weight:900;line-height:1}
.sum .st{color:#FFB800;font-size:22px;letter-spacing:2px}
.sum small{display:block;font-size:14px;color:#6F6975;margin-top:2px}
.sum .cta{margin-left:auto;background:#E5007F;color:#fff;font-weight:800;padding:14px 22px;border-radius:999px;font-size:15px}
.grid{columns:3 300px;column-gap:18px}
.card{break-inside:avoid;background:#fff;border:1px solid #ECE5E9;border-radius:18px;padding:22px 22px 18px;margin-bottom:18px}
.card .st{color:#FFB800;font-size:15px;letter-spacing:1px}
.card p{font-size:16px;line-height:1.75;margin:10px 0 14px;white-space:pre-wrap;word-break:break-word}
.card .who{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:#6F6975;border-top:1px solid #F1ECEF;padding-top:12px}
.card .who b{color:#17131B}
.card .tag{background:#F4EFF2;border-radius:999px;padding:4px 10px;font-size:12px;color:#4B4651;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:60px 20px;text-align:center;color:#6F6975;background:#fff;border-radius:18px;border:1px dashed #DDD3D8}
.more{display:block;margin:10px auto 0;border:1.5px solid #17131B;background:#fff;border-radius:999px;padding:14px 28px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.ft{text-align:center;font-size:13px;color:#8C8790;padding:30px 20px 50px}
@media (max-width:640px){.wrap{padding:36px 16px 70px}.sum{padding:18px}.sum .cta{margin-left:0;width:100%;text-align:center}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in"><a class="brand" href="/"><img src="/assets/home/pbs-mark.png" alt="">PBS COLOR LAB</a><a class="back" href="/">← 홈으로</a></div></header>
<main class="wrap">
  <p class="kick">VOICES</p>
  <h1>수강생 후기 모음</h1>
  <p class="lead">최해숙 대표의 강의·컬러콘서트·자격과정 현장에서 참여자가 직접 남긴 후기입니다.</p>
  <div class="sum" id="sum" hidden><b id="avg">-</b><div><span class="st" id="avgSt"></span><small id="cnt"></small></div><a class="cta" href="/#contact">강의·교육 문의하기</a></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>아직 등록된 후기가 없습니다.</div>
  <button class="more" id="more" hidden>후기 더 보기</button>
</main>
<p class="ft">© PBS COLOR LAB · 최해숙</p>
<script>
(function(){
var SU='https://oqxlsnyuwtmjmbhgzjoz.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xeGxzbnl1d3Rtam1iaGd6am96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NTc5NDksImV4cCI6MjA5MjMzMzk0OX0.C-PPch12eVru2xhuU80WPYdBj5CJb1Py8m1-OsaGZW8',H={apikey:SK,Authorization:'Bearer '+SK};
var PAGE=30,off=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function d(x){x=new Date(x);return x.getFullYear()+'.'+('0'+(x.getMonth()+1)).slice(-2)+'.'+('0'+x.getDate()).slice(-2)}
function load(){
 fetch(SU+'/rest/v1/live_reviews?select=name,rating,msg,room_title,created_at&order=created_at.desc&offset='+off+'&limit='+PAGE,{headers:H}).then(function(r){return r.json()}).then(function(rows){
  if(!Array.isArray(rows))rows=[];
  if(!off&&!rows.length){document.getElementById('empty').hidden=false}
  document.getElementById('grid').insertAdjacentHTML('beforeend',rows.map(function(r){return '<figure class="card"><span class="st">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</span><p>'+esc(r.msg)+'</p><figcaption class="who"><span><b>'+esc(r.name)+'</b> · '+d(r.created_at)+'</span>'+(r.room_title?'<span class="tag">'+esc(r.room_title)+'</span>':'')+'</figcaption></figure>'}).join(''));
  off+=rows.length;document.getElementById('more').hidden=rows.length<PAGE;
 }).catch(function(){document.getElementById('empty').hidden=false});
}
fetch(SU+'/rest/v1/live_reviews?select=rating',{headers:Object.assign({Prefer:'count=exact'},H)}).then(function(r){return r.json()}).then(function(a){
 if(!Array.isArray(a)||!a.length)return;var s=0;a.forEach(function(x){s+=x.rating});var v=(s/a.length);
 document.getElementById('avg').textContent=v.toFixed(1);document.getElementById('avgSt').textContent='★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v));
 document.getElementById('cnt').textContent='후기 '+a.length+'개 · 참여자가 직접 남긴 별점 평균';document.getElementById('sum').hidden=false;
}).catch(function(){});
document.getElementById('more').onclick=load;load();
})();
</script>
</body>
</html>
