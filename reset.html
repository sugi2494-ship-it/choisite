<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>PBS COLOR LAB 관리자 비밀번호 재설정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#110b20;--card:#211735;--line:#44325f;--pink:#e6007e;--muted:#b9adc9}
  *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#110b20,#261238);color:#fff;font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:rgba(33,23,53,.96);border:1px solid var(--line);border-radius:20px;padding:26px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  h1{font-size:20px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6;font-size:14px;margin:0 0 16px}
  label{display:block;font-size:13px;margin:10px 0 4px;color:#e7dcf5}
  input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#120c1f;color:#fff;font-size:15px}
  .btn{margin-top:14px;width:100%;border:0;border-radius:999px;padding:13px;color:#fff;background:var(--pink);font-weight:800;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:wait}
  .status{min-height:20px;margin-top:12px;font-size:14px;line-height:1.6}.ok{color:#91ffd0}.err{color:#ff9fcf}
  .steps{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 관리자 비밀번호 재설정</h1>

    <section id="requestView">
      <p class="muted">등록된 관리자 이메일로 <b>재설정 링크</b>를 보냅니다. 메일의 링크를 누르면 이 페이지로 돌아와 새 비밀번호를 정할 수 있어요.</p>
      <label>관리자 이메일</label>
      <input id="email" type="email" value="sugi2494@gmail.com" autocomplete="username">
      <button id="sendBtn" class="btn">재설정 링크 메일 받기</button>
      <div id="msg1" class="status"></div>
      <div class="steps">순서 : ① 이 버튼 누르기 → ② 메일 확인(스팸함도 확인) → ③ 메일 속 링크 클릭 → ④ 새 비밀번호 입력 → ⑤ admin.html에서 새 비밀번호로 로그인</div>
    </section>

    <section id="setView" hidden>
      <p class="muted">✅ 확인됐습니다. <b>새 비밀번호</b>를 정해주세요. (6자 이상, 대표님만 아는 것으로)</p>
      <label>새 비밀번호</label>
      <input id="np" type="password" autocomplete="new-password">
      <label>새 비밀번호 확인</label>
      <input id="np2" type="password" autocomplete="new-password">
      <button id="saveBtn" class="btn">새 비밀번호 저장</button>
      <div id="msg2" class="status"></div>
    </section>
  </div>

<script>
'use strict';
const SB_URL='https://oqxlsnyuwtmjmbhgzjoz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xeGxzbnl1d3Rtam1iaGd6am96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NTc5NDksImV4cCI6MjA5MjMzMzk0OX0.C-PPch12eVru2xhuU80WPYdBj5CJb1Py8m1-OsaGZW8';
const ADMIN='sugi2494@gmail.com';
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
async function showSetIfSession(){
  const {data:{session}}=await db.auth.getSession();
  if(session && (session.user.email||'').toLowerCase()===ADMIN){$('requestView').hidden=true;$('setView').hidden=false;}
}
$('sendBtn').onclick=async()=>{
  const email=($('email').value||'').trim().toLowerCase();
  const b=$('sendBtn'), m=$('msg1');
  if(email!==ADMIN){m.className='status err';m.textContent='등록된 관리자 이메일만 사용할 수 있습니다.';return;}
  b.disabled=true;m.className='status';m.textContent='메일 보내는 중…';
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset.html'});
  b.disabled=false;
  if(error){m.className='status err';m.textContent='발송 실패: '+error.message;}
  else{m.className='status ok';m.textContent='✅ 메일을 보냈습니다. 메일함(스팸함 포함)에서 링크를 눌러주세요.';}
};
$('saveBtn').onclick=async()=>{
  const np=$('np').value, np2=$('np2').value, m=$('msg2');
  if(!np||np.length<6){m.className='status err';m.textContent='6자 이상 입력하세요.';return;}
  if(np!==np2){m.className='status err';m.textContent='두 비밀번호가 서로 다릅니다.';return;}
  m.className='status';m.textContent='변경 중…';
  const {error}=await db.auth.updateUser({password:np});
  if(error){m.className='status err';m.textContent='변경 실패: '+error.message;}
  else{m.className='status ok';m.textContent='✓ 새 비밀번호로 변경됐습니다! 이제 admin.html 로 가서 이 비밀번호로 로그인하세요.';}
};
db.auth.onAuthStateChange(()=>showSetIfSession());
showSetIfSession();
</script>
</body>
</html>
